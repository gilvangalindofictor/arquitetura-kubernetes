# Kyverno Validation Rules - Domínios Corporativos
# Referência: ADR-048, ADR-049, GOVERNANCE.md
# Deploy: kubectl apply -f validation-rules.yaml

---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-corporate-labels
  annotations:
    policies.kyverno.io/title: Require Corporate Governance Labels
    policies.kyverno.io/category: Corporate Governance
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: |
      Valida que todos os recursos em namespaces corporativos tenham labels obrigatórias.
      Referência: ADR-048 (Naming Conventions Determinísticas)
spec:
  validationFailureAction: Enforce
  background: true
  rules:
  - name: check-corporate-labels
    match:
      any:
      - resources:
          kinds:
          - Pod
          - Deployment
          - StatefulSet
          - DaemonSet
          - Service
          namespaces:
          - "staging-*"
          - "prod-*"
    validate:
      message: |
        ❌ Labels obrigatórias faltando ou inválidas (ADR-048).
        Obrigatórias: domain, owner, environment, app.kubernetes.io/name, app.kubernetes.io/part-of
        Ver: /docs/governance/naming-conventions.md
      pattern:
        metadata:
          labels:
            domain: "platform | integration | data | operations | shared-services | security | governance"
            owner: "*-team"
            environment: "dev | staging | prod"
            app.kubernetes.io/name: "?*"
            app.kubernetes.io/part-of: "?*"

---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: validate-namespace-naming
  annotations:
    policies.kyverno.io/title: Validate Namespace Naming Convention
    policies.kyverno.io/category: Corporate Governance
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: |
      Valida que namespaces corporativos sigam naming convention: {env}-{domain}-{product}
      Referência: ADR-048
spec:
  validationFailureAction: Enforce
  background: false
  rules:
  - name: check-namespace-name
    match:
      any:
      - resources:
          kinds:
          - Namespace
    exclude:
      any:
      - resources:
          names:
          # System namespaces (Kubernetes built-in)
          - kube-system
          - kube-public
          - kube-node-lease
          - default
          # Infrastructure namespaces (pre-existing, non-corporate naming)
          - cert-manager
          - kyverno
          - velero
          - argocd-test
          # Linkerd Service Mesh (GAP-011) — upstream Helm charts require these exact names
          - linkerd
          - linkerd-viz
          - linkerd-jaeger
          - linkerd-cni
    validate:
      allowExistingViolations: true
      message: |
        Namespace naming violado (ADR-048).
        Esperado: {env}-{domain}-{product}
        Dominios: platform, integration, data, operations, shared, security, governance, observability
        Exemplos: staging-integration-ipaas, prod-data-hatch, prod-observability-monitoring
      anyPattern:
      # prod-{domain}-{product}
      - metadata:
          name: "prod-platform-?*"
      - metadata:
          name: "prod-integration-?*"
      - metadata:
          name: "prod-data-?*"
      - metadata:
          name: "prod-operations-?*"
      - metadata:
          name: "prod-shared-?*"
      - metadata:
          name: "prod-security-?*"
      - metadata:
          name: "prod-governance-?*"
      - metadata:
          name: "prod-observability-?*"
      # staging-{domain}-{product}
      - metadata:
          name: "staging-platform-?*"
      - metadata:
          name: "staging-integration-?*"
      - metadata:
          name: "staging-data-?*"
      - metadata:
          name: "staging-operations-?*"
      - metadata:
          name: "staging-shared-?*"
      - metadata:
          name: "staging-security-?*"
      - metadata:
          name: "staging-governance-?*"
      - metadata:
          name: "staging-observability-?*"
      # dev-{domain}-{product}
      - metadata:
          name: "dev-platform-?*"
      - metadata:
          name: "dev-integration-?*"
      - metadata:
          name: "dev-data-?*"
      - metadata:
          name: "dev-operations-?*"
      - metadata:
          name: "dev-shared-?*"
      - metadata:
          name: "dev-security-?*"
      - metadata:
          name: "dev-governance-?*"
      - metadata:
          name: "dev-observability-?*"
      # shared-{domain}-{product}
      - metadata:
          name: "shared-platform-?*"
      - metadata:
          name: "shared-integration-?*"
      - metadata:
          name: "shared-data-?*"
      - metadata:
          name: "shared-operations-?*"
      - metadata:
          name: "shared-shared-?*"
      - metadata:
          name: "shared-security-?*"
      - metadata:
          name: "shared-governance-?*"
      - metadata:
          name: "shared-observability-?*"

---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: validate-service-naming
  annotations:
    policies.kyverno.io/title: Validate Service Naming Convention
    policies.kyverno.io/category: Corporate Governance
    policies.kyverno.io/severity: medium
spec:
  validationFailureAction: Audit  # Apenas alerta, não bloqueia
  background: true
  rules:
  - name: check-service-name
    match:
      any:
      - resources:
          kinds:
          - Service
          namespaces:
          - "staging-*"
          - "prod-*"
    validate:
      message: |
        ⚠️ Service naming não segue convenção: lowercase-kebab-case
        Formato: ^[a-z0-9-]+$
      pattern:
        metadata:
          name: "[a-z0-9-]*"

---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: validate-label-values
  annotations:
    policies.kyverno.io/title: Validate Label Values Format
    policies.kyverno.io/category: Corporate Governance
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: true
  rules:
  - name: check-label-domain
    match:
      any:
      - resources:
          kinds:
          - Pod
          - Deployment
          - StatefulSet
          namespaces:
          - "staging-*"
          - "prod-*"
    validate:
      message: |
        ❌ Label 'domain' inválido.
        Valores permitidos: platform, integration, data, operations, shared-services
      pattern:
        metadata:
          labels:
            domain: "platform | integration | data | operations | shared-services | security | governance"

  - name: check-label-owner
    match:
      any:
      - resources:
          kinds:
          - Pod
          - Deployment
          - StatefulSet
          namespaces:
          - "staging-*"
          - "prod-*"
    validate:
      message: |
        ❌ Label 'owner' inválido.
        Formato: ^[a-z0-9-]+-team$
        Exemplos: integration-team, data-team
      pattern:
        metadata:
          labels:
            owner: "*-team"

  - name: check-label-environment
    match:
      any:
      - resources:
          kinds:
          - Pod
          - Deployment
          - StatefulSet
          namespaces:
          - "staging-*"
          - "prod-*"
    validate:
      message: |
        ❌ Label 'environment' inválido.
        Valores permitidos: dev, staging, prod
      pattern:
        metadata:
          labels:
            environment: "dev | staging | prod"

---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: allow-governance-exceptions
  annotations:
    policies.kyverno.io/title: Allow Governance Exceptions
    policies.kyverno.io/category: Corporate Governance
    policies.kyverno.io/severity: low
spec:
  validationFailureAction: Audit
  background: true
  rules:
  - name: check-exception-expiration
    match:
      any:
      - resources:
          kinds:
          - Pod
          - Deployment
          - StatefulSet
          selector:
            matchLabels:
              governance-exception: "true"
    validate:
      message: |
        ⚠️ Recurso com governance-exception deve ter:
        - governance-exception-issue: URL do Issue GitLab
        - governance-exception-expires: Data de expiração (YYYY-MM-DD)
      pattern:
        metadata:
          labels:
            governance-exception: "true"
            governance-exception-issue: "?*"
            governance-exception-expires: "?*"

