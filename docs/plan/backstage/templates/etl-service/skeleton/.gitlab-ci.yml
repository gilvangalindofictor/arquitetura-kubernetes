# Pipeline GitLab CI/CD — Gerado pelo Backstage Scaffolder
# Serviço: ${{ values.name }} | Tipo: ${{ values.serviceType }} | Domínio: data
#
# ── Variáveis CI/CD obrigatórias (configure em Settings → CI/CD → Variables) ──
# KUBECONFIG_STAGING  : Protected, Masked — kubeconfig base64 do cluster EKS staging
# VAULT_ADDR          : Protected — URL do Vault (ex: https://vault.staging.internal)
# CI_REGISTRY_USER    : Protected — Harbor robot username
# CI_REGISTRY_PASSWORD: Protected, Masked — Harbor robot token
# HARBOR_CA_CERT_B64  : Opcional — CA cert do Harbor em base64

stages:
  - validate
  - test
  - build
  - security-scan
  - quality-gate
  - provision
  - migrate
  - deploy

variables:
  APP_NAME: "${{ values.name }}"
  DOMAIN: "data"
  NAMESPACE: "staging-data-${{ values.name }}"
  HARBOR_REGISTRY: "harbor.staging.internal"
  IMAGE_BASE: "${HARBOR_REGISTRY}/data/${{ values.name }}"
  PLATFORM_PROVISIONING_PROJECT: "platform/platform-core"

# ── Workflow: quando rodar ───────────────────────────────────────────────────
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "staging"'
      variables:
        DEPLOY_ENABLED: "false"
    - if: '$CI_COMMIT_BRANCH == "staging"'
      variables:
        DEPLOY_ENABLED: "true"
    - if: '$CI_COMMIT_BRANCH == "main"'
      variables:
        DEPLOY_ENABLED: "true"
    - when: never

# ── Includes de templates compartilhados ────────────────────────────────────
include:
  - project: "platform/templates"
    file: "/gitlab-ci/templates/security.gitlab-ci-security-template.yml"
  - project: "platform/templates"
    file: "/gitlab-ci/templates/sonarqube-quality-gate.gitlab-ci.yml"

# ── Stage: validate ──────────────────────────────────────────────────────────
validate-manifest:
  stage: validate
  image: alpine:3.19
  before_script:
    - apk add --no-cache curl bash yq python3 py3-pip
    - pip3 install --quiet jsonschema pyyaml
    - git clone --depth=1 "https://gitlab.staging.internal/${PLATFORM_PROVISIONING_PROJECT}.git" /tmp/platform
  script:
    - echo "Validando .platform/manifest.yaml contra o schema..."
    - python3 /tmp/platform/app-provisioning/scripts/validate-manifest.py .platform/manifest.yaml
    - echo "Validação aprovada"
  rules:
    - when: always

validate-naming:
  stage: validate
  image: alpine:3.19
  before_script:
    - apk add --no-cache bash
  script:
    - |
      APP_NAME="${APP_NAME}"
      if ! echo "$APP_NAME" | grep -qE '^[a-z][a-z0-9-]{1,40}$'; then
        echo "ERRO: APP_NAME=$APP_NAME não segue kebab-case (ADR-048)"
        exit 1
      fi
      echo "Naming OK: $APP_NAME"
  rules:
    - when: always

# ── Stage: test ───────────────────────────────────────────────────────────────
unit-tests:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install --quiet -r requirements.txt
  script:
    - python -m pytest tests/unit/ -v --tb=short
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    when: always
    expire_in: 7 days
  rules:
    - when: always

# ── Stage: build ──────────────────────────────────────────────────────────────
build-image:
  stage: build
  image: docker:26.1-dind
  services:
    - docker:26.1-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$HARBOR_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - |
      IMAGE_TAG="${IMAGE_BASE}:${CI_COMMIT_SHA}"
      IMAGE_BRANCH="${IMAGE_BASE}:${CI_COMMIT_REF_SLUG}"
      docker build -t "$IMAGE_TAG" -t "$IMAGE_BRANCH" .
      docker push "$IMAGE_TAG"
      docker push "$IMAGE_BRANCH"
      echo "IMAGE_TAG=${IMAGE_TAG}" >> build.env
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 7 days
  rules:
    - when: on_success

# ── Stage: provision ──────────────────────────────────────────────────────────
provision-resources:
  stage: provision
  image: alpine:3.19
  before_script:
    - apk add --no-cache bash curl yq postgresql-client
    - |
      # Instala vault CLI
      VAULT_VERSION="1.15.4"
      wget -q "https://releases.hashicorp.com/vault/${VAULT_VERSION}/vault_${VAULT_VERSION}_linux_amd64.zip" -O /tmp/vault.zip
      unzip -q /tmp/vault.zip -d /usr/local/bin/
      chmod +x /usr/local/bin/vault
    - |
      # Configura kubeconfig
      echo "$KUBECONFIG_STAGING" | base64 -d > /tmp/kubeconfig
      export KUBECONFIG=/tmp/kubeconfig
    - |
      # Vault auth via Kubernetes (JWT dinâmico — ADR-104)
      VAULT_TOKEN=$(vault write -field=token auth/kubernetes/login \
        role="platform-provisioner" \
        jwt="$(cat /run/secrets/kubernetes.io/serviceaccount/token 2>/dev/null || echo $CI_JOB_JWT)")
      export VAULT_TOKEN
  script:
    - bash scripts/provision.sh
  environment:
    name: staging
  rules:
    - if: '$DEPLOY_ENABLED == "true"'
      when: on_success
    - when: never

# ── Stage: migrate ────────────────────────────────────────────────────────────
run-migrations:
  stage: migrate
  image: python:3.12-slim
  before_script:
    - pip install --quiet -r requirements.txt
    - |
      echo "$KUBECONFIG_STAGING" | base64 -d > /tmp/kubeconfig
      export KUBECONFIG=/tmp/kubeconfig
  script:
    - |
{%- if values.databaseEnabled %}
      echo "Executando migrações de banco de dados..."
      python -m alembic upgrade head || python run_migrations.py 2>/dev/null || echo "Sem migrações configuradas"
{%- else %}
      echo "Banco de dados não habilitado — skip migrações"
{%- endif %}
  rules:
    - if: '$DEPLOY_ENABLED == "true"'
      when: on_success
    - when: never

# ── Stage: deploy ─────────────────────────────────────────────────────────────
deploy-staging:
  stage: deploy
  image: alpine:3.19
  before_script:
    - apk add --no-cache helm kubectl bash
    - |
      echo "$KUBECONFIG_STAGING" | base64 -d > /tmp/kubeconfig
      export KUBECONFIG=/tmp/kubeconfig
  script:
    - |
      IMAGE_TAG="${IMAGE_BASE}:${CI_COMMIT_SHA}"
      helm upgrade --install "$APP_NAME" helm/ \
        --namespace "$NAMESPACE" \
        --create-namespace \
        --values helm/values.yaml \
        --values helm/values/staging.yaml \
        --set image.tag="$CI_COMMIT_SHA" \
        --set image.repository="$IMAGE_BASE" \
        --wait \
        --timeout 10m
      echo "Deploy concluído: $IMAGE_TAG → $NAMESPACE"
  environment:
    name: staging
    url: "https://$APP_NAME.staging.internal"
  rules:
    - if: '$DEPLOY_ENABLED == "true"'
      when: on_success
    - if: '$DEPLOY_ENABLED == "manual"'
      when: manual
      allow_failure: false
    - when: never
