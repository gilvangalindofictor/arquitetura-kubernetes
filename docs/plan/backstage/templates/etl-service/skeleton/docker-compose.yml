# Ambiente de desenvolvimento local para ${{ values.name }}
# Uso: docker-compose up -d
version: "3.9"

services:
  etl:
    build:
      context: .
      target: runtime
    environment:
      APP_ENV: development
      ETL_TEST_MODE: "true"
      ETL_TEST_LIMIT_RECORDS: "10"
      LOG_LEVEL: DEBUG
{%- if values.databaseEnabled %}
      DATABASE_URL: postgresql://etl_user:etl_pass@postgres:5432/etl_db
      DATABASE_PASSWORD: etl_pass
{%- endif %}
{%- if values.redisEnabled %}
      REDIS_URL: redis://:redis_pass@redis:6379/0
      REDIS_PASSWORD: redis_pass
{%- endif %}
    volumes:
      - ./config:/app/config:ro
    depends_on:
{%- if values.databaseEnabled %}
      - postgres
{%- endif %}
{%- if values.redisEnabled %}
      - redis
{%- endif %}
    ports:
      - "8000:8000"
      - "9090:9090"

{%- if values.databaseEnabled %}
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: etl_db
      POSTGRES_USER: etl_user
      POSTGRES_PASSWORD: etl_pass
    ports:
      - "5432:5432"
{%- endif %}

{%- if values.redisEnabled %}
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass redis_pass
    ports:
      - "6379:6379"
{%- endif %}
