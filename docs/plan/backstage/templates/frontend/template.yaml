# =============================================================================
# Backstage Software Template: Frontend Service
# Cria um novo serviço Frontend React + nginx com K8s e Ingress
# Sprint S6 / M2 — ADR-055
# Nota: Frontend não recebe AppRole Vault (sem acesso direto a secrets)
# =============================================================================

apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: frontend-template
  title: "Frontend Service (React + nginx + K8s)"
  description: "Cria aplicação Frontend React servida por nginx com Kubernetes manifests e Ingress"
  tags:
    - react
    - frontend
    - kubernetes
    - nginx
    - recommended
  annotations:
    backstage.io/managed-by-location: "url:https://gitlab.staging.internal/platform/backstage-catalog/-/blob/main/templates/frontend/template.yaml"
    backstage.io/techdocs-ref: "dir:."
spec:
  owner: platform-team
  type: website

  # ---------------------------------------------------------------------------
  # Parameters — GAP-008: validação de input com regex obrigatória
  # NUNCA usar title como identificador direto (XSS/injection via UI)
  # ---------------------------------------------------------------------------
  parameters:
    - title: "Informações do Serviço"
      required:
        - name
        - description
        - owner
      properties:
        name:
          title: "Nome do serviço"
          type: string
          description: "Identificador único. Letras minúsculas, números e hífens. Ex: meu-frontend"
          pattern: '^[a-z][a-z0-9-]{2,40}$'
          ui:autofocus: true
          ui:help: "Será usado como nome do repositório GitLab e labels Kubernetes"
        description:
          title: "Descrição"
          type: string
          description: "Descrição curta do propósito do frontend"
          maxLength: 200
        owner:
          title: "Squad responsável"
          type: string
          description: "Squad dona do serviço"
          enum:
            - "platform-team"
            - "data-team"
            - "backend-team"
            - "ops-team"
          enumNames:
            - "Platform Team"
            - "Data Team"
            - "Backend Team"
            - "Ops Team"

    - title: "Configuração do Frontend"
      properties:
        node_version:
          title: "Versão Node.js"
          type: string
          description: "Versão Node.js para build da aplicação React"
          default: "22"
          enum: ["20", "22"]
          enumNames:
            - "Node.js 20 LTS"
            - "Node.js 22 LTS"
        ingress_host:
          title: "Host do Ingress"
          type: string
          description: "Hostname para o Ingress Kubernetes. Ex: meu-app.staging.internal"
          pattern: '^[a-z0-9][a-z0-9\-\.]{1,61}[a-z0-9]\.[a-z]{2,}$'
          ui:help: "Domínio completo (FQDN) para roteamento via Ingress"

    - title: "Repositório GitLab"
      required:
        - gitlab_group
      properties:
        gitlab_group:
          title: "Grupo GitLab"
          type: string
          description: "Grupo GitLab onde o repositório será criado"
          default: "frontend"
          enum:
            - "frontend"
            - "platform"
        repo_visibility:
          title: "Visibilidade"
          type: string
          description: "Visibilidade do repositório"
          default: "internal"
          enum: ["private", "internal"]

  # ---------------------------------------------------------------------------
  # Steps — ações executadas sequencialmente pelo Scaffolder
  # Nota: sem step vault-namespace — frontends não têm AppRole Vault
  # ---------------------------------------------------------------------------
  steps:
    - id: fetch-template
      name: "Gerar estrutura do projeto"
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          node_version: ${{ parameters.node_version }}
          ingress_host: ${{ parameters.ingress_host }}
          gitlab_group: ${{ parameters.gitlab_group }}

    - id: validate-manifest
      name: "Validar Manifest da Plataforma"
      action: platform:manifest:validate
      # Frontend não requer .platform/manifest.yaml (sem AppRole Vault — ADR-102).
      # continueOnError: true permite scaffold mesmo sem manifest válido.
      continueOnError: true
      input:
        manifestPath: .platform/manifest.yaml

    - id: publish-gitlab
      name: "Criar repositório e abrir MR no GitLab"
      action: publish:gitlab
      input:
        repoUrl: "gitlab.staging.internal?owner=${{ parameters.gitlab_group }}&repo=frontend-${{ parameters.name }}"
        description: ${{ parameters.description }}
        defaultBranch: main
        repoVisibility: ${{ parameters.repo_visibility }}
        # GAP-SEC-S6-11: 'error' falha explicitamente se branch já existe — evita push acidental
        onExistingBranch: error
        gitCommitMessage: "feat: scaffold frontend service ${{ parameters.name }} via Backstage Golden Path"
        branchName: "scaffold/${{ parameters.name }}"
        sourceBranch: "scaffold/${{ parameters.name }}"
        title: "feat: scaffold frontend service ${{ parameters.name }}"
        mrDescription: "Frontend service scaffolded via Backstage Software Template\n\nService: ${{ parameters.name }}\nOwner: ${{ parameters.owner }}\nGitLab Group: ${{ parameters.gitlab_group }}"

    - id: register-catalog
      name: "Registrar no Backstage Catalog"
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish-gitlab'].output.repoContentsUrl }}
        catalogInfoPath: "/catalog-info.yaml"

  # ---------------------------------------------------------------------------
  # Output
  # ---------------------------------------------------------------------------
  output:
    links:
      - title: "Repositório GitLab"
        url: ${{ steps['publish-gitlab'].output.remoteUrl }}
        icon: gitlab
      - title: "Pull Request aberto"
        url: ${{ steps['publish-gitlab'].output.mergeRequestUrl }}
        icon: gitlab
      - title: "Ver no Backstage Catalog"
        icon: catalog
        entityRef: ${{ steps['register-catalog'].output.entityRef }}
