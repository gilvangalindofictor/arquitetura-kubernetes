# =============================================================================
# ArgoCD SA para Backstage Scaffolder (GAP-009)
# SA backstage-scaffolder: cria ArgoCD Applications (apenas create, não delete/sync)
# Separado do backstage-reader (read-only) para princípio de menor privilégio
# Aplicar: kubectl apply -f argocd-scaffolder-sa.yaml
# ADR: ADR-055
# =============================================================================

---
# ServiceAccount no namespace ArgoCD
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backstage-scaffolder
  namespace: staging-platform-argocd
  labels:
    app.kubernetes.io/name: backstage
    app.kubernetes.io/component: scaffolder
    app.kubernetes.io/managed-by: terraform

---
# Role: permite apenas CREATE de Applications no namespace argocd
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backstage-scaffolder
  namespace: staging-platform-argocd
  labels:
    app.kubernetes.io/name: backstage
    app.kubernetes.io/component: scaffolder
    app.kubernetes.io/managed-by: terraform
  annotations:
    backstage.io/reason: "Backstage Scaffolder creates ArgoCD Applications for new services"
    backstage.io/review-date: "2026-09-11"
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["create", "get"]   # get necessário para verificar se já existe
  - apiGroups: [""]
    resources: ["secrets"]     # necessário para sync de repos privados
    verbs: ["get"]

---
# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backstage-scaffolder
  namespace: staging-platform-argocd
  labels:
    app.kubernetes.io/name: backstage
    app.kubernetes.io/managed-by: terraform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backstage-scaffolder
subjects:
  - kind: ServiceAccount
    name: backstage-scaffolder
    namespace: staging-platform-argocd

---
# =============================================================================
# GAP-SEC-S6-17 (MÉDIO): Token long-lived para SA backstage-scaffolder (DEPRECATED)
# =============================================================================
# O Secret abaixo usa kubernetes.io/service-account-token (token estático sem expiração).
# Este padrão foi DEPRECATED no Kubernetes 1.24+ e é um risco de segurança:
#   - Token não expira → comprometimento = acesso permanente até remoção manual
#   - Token não é rotacionado automaticamente
#   - kubernetes.io/service-account-token secrets serão removidos em versão futura do K8s
#
# SOLUÇÃO RECOMENDADA — Projeção de volume com TokenRequest API (TTL 1h):
#
#   volumes:
#     - name: scaffolder-token
#       projected:
#         sources:
#           - serviceAccountToken:
#               path: token
#               expirationSeconds: 3600   # TTL 1h — rotacionado automaticamente pelo kubelet
#               audience: argocd-server   # Audience restrito ao ArgoCD — evita replay em outros serviços
#
#   volumeMounts:
#     - name: scaffolder-token
#       mountPath: /var/run/secrets/scaffolder
#       readOnly: true
#
# O token fica disponível em /var/run/secrets/scaffolder/token no pod do Backstage.
# O Scaffolder deve ser configurado para ler o token deste path (não de uma variável de ambiente).
#
# REFERÊNCIA: https://kubernetes.io/docs/reference/access-authn-authz/service-accounts-admin/
#             #bound-service-account-token-volume
#
# TODO GAP-SEC-S6-17: Migrar para TokenRequest API após validação do Scaffolder.
#   Passos:
#     1. Adicionar volume projetado no Deployment do Backstage (via helm-values-staging.yaml)
#     2. Configurar @backstage/plugin-scaffolder-backend para ler token do volume
#     3. Validar que o Scaffolder consegue criar ArgoCD Applications com o token projetado
#     4. Remover este Secret após validação (sprint S6-B ou S6-C)
#   BLOQUEADOR: Requer validação do comportamento do Scaffolder com TokenRequest API
#               Não executar antes de teste em staging controlado
# =============================================================================
#
# ATENÇÃO: O Secret abaixo é MANTIDO temporariamente para não quebrar o Scaffolder.
# PRAZO MÁXIMO para migração: Sprint S6-B (estimado 2026-04-01).
# Após a migração, DELETAR este Secret e o bloco abaixo.
#
apiVersion: v1
kind: Secret
metadata:
  name: backstage-scaffolder-token
  namespace: staging-platform-argocd
  annotations:
    kubernetes.io/service-account.name: backstage-scaffolder
    # GAP-SEC-S6-17: este Secret long-lived é DEPRECATED — migrar para TokenRequest API
    # Ver comentário acima para o plano de migração completo
type: kubernetes.io/service-account-token
