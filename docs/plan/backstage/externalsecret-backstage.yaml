# ExternalSecret — Backstage IDP
# ClusterSecretStore: vault-backend (VALID, K8s auth role eso-reader)
# Namespace: staging-platform-backstage
# Criado: 2026-03-05
#
# Pré-requisito: paths Vault em secret/staging/backstage/* devem estar preenchidos
# (executar bootstrap-vault-setup.sh antes de aplicar este manifest)
#
# Aplicar: kubectl apply -f externalsecret-backstage.yaml
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backstage-secrets
  namespace: staging-platform-backstage
  annotations:
    description: "Backstage IDP credentials from Vault (ADR-055)"
    # GAP-SEC-S6-14 (MÉDIO): evita que ArgoCD delete o Secret gerado durante prune
    # Sem esta annotation, um sync com prune ativo deletaria o Secret backstage-secrets
    argocd.argoproj.io/sync-options: "Prune=false"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: backstage-secrets
    creationPolicy: Owner
    # GAP-SEC-S6-13 (ALTO): sem deletionPolicy, o Secret gerado é deletado junto com o ExternalSecret
    # 'Retain' preserva o Secret mesmo se o ExternalSecret for removido (evita outage do Backstage)
    deletionPolicy: Retain
  data:
    # ─── PostgreSQL (RDS) ───────────────────────────────────────────────────
    - secretKey: postgres-host
      remoteRef:
        key: secret/staging/backstage/database
        property: postgres-host
    - secretKey: postgres-user
      remoteRef:
        key: secret/staging/backstage/database
        property: postgres-user
    - secretKey: postgres-password
      remoteRef:
        key: secret/staging/backstage/database
        property: postgres-password
    # ─── Keycloak OIDC ─────────────────────────────────────────────────────
    - secretKey: keycloak-client-id
      remoteRef:
        key: secret/staging/backstage/keycloak
        property: client-id
    - secretKey: keycloak-client-secret
      remoteRef:
        key: secret/staging/backstage/keycloak
        property: client-secret
    # ─── GitLab ────────────────────────────────────────────────────────────
    - secretKey: gitlab-token
      remoteRef:
        key: secret/staging/backstage/gitlab
        property: token
    # ─── Vault (endereço interno para plugins) ─────────────────────────────
    - secretKey: vault-addr
      remoteRef:
        key: secret/staging/backstage/vault
        property: addr
    # ─── ArgoCD ────────────────────────────────────────────────────────────
    - secretKey: argocd-url
      remoteRef:
        key: secret/staging/backstage/argocd
        property: url
    - secretKey: argocd-token
      remoteRef:
        key: secret/staging/backstage/argocd
        property: token
    # ─── SonarQube ─────────────────────────────────────────────────────────
    - secretKey: sonarqube-url
      remoteRef:
        key: secret/staging/backstage/sonarqube
        property: url
    - secretKey: sonarqube-token
      remoteRef:
        key: secret/staging/backstage/sonarqube
        property: token
    # ─── EKS Cluster URL (plugin Kubernetes) ───────────────────────────────
    - secretKey: eks-cluster-url
      remoteRef:
        key: secret/staging/backstage/eks
        property: cluster-url
    # ─── Session Secret (gerado por bootstrap script) ──────────────────────
    - secretKey: auth-session-secret
      remoteRef:
        key: secret/staging/backstage/session
        property: auth-session-secret
    # ─── Harbor (plugin registry) ──────────────────────────────────────────
    - secretKey: harbor-url
      remoteRef:
        key: secret/staging/backstage/harbor
        property: url
    - secretKey: harbor-robot-token
      remoteRef:
        key: secret/staging/backstage/harbor
        property: robot-token
