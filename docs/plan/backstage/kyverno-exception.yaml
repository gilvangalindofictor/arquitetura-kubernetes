# =============================================================================
# Kyverno PolicyException — Backstage + Linkerd init container
# Namespace:  staging-platform-backstage
# Atualizado: 2026-03-05
# ADR:        ADR-055 (MEDIO-2)
#
# Contexto:
#   O Linkerd proxy-init container requer NET_ADMIN e NET_RAW para configurar
#   regras iptables (redirecionamento de trafego). As policies Kyverno
#   disallow-privilege-escalation e disallow-capabilities bloqueiam isso.
#
# Escopo: SOMENTE namespace staging-platform-backstage (minimo necessario).
#
# Alternativa futura: migrar para Linkerd native sidecars (v2.15+) que
#   nao precisam de NET_ADMIN. Kubernetes 1.34 ja suporta native sidecars.
#
# Aplicar: kubectl apply -f kyverno-exception.yaml
#
# Referencia: https://kyverno.io/docs/writing-policies/exceptions/
# =============================================================================

apiVersion: kyverno.io/v2beta1
kind: PolicyException
metadata:
  name: backstage-linkerd-exception
  namespace: staging-platform-backstage
  annotations:
    backstage.io/reason: "Linkerd proxy-init requires NET_ADMIN/NET_RAW for iptables rules"
    backstage.io/review-date: "2026-09-05"
    backstage.io/owner: platform-team
spec:
  exceptions:
    - policyName: disallow-privilege-escalation
      ruleNames: [privilege-escalation]
    - policyName: disallow-capabilities
      ruleNames: [adding-capabilities]
  match:
    any:
      - resources:
          kinds: [Pod]
          namespaces: [staging-platform-backstage]
