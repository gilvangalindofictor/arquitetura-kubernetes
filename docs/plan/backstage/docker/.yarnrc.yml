# =============================================================================
# .yarnrc.yml — Configuracao Yarn 4.4.1 (Berry)
# Package manager oficial Backstage v1.48.0
# =============================================================================

nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.4.1.cjs

# Cache offline para builds reproduziveis
enableGlobalCache: false

# Aumentar timeout para instalacao de dependencias em CI
httpTimeout: 120000

# Desabilitar telemetria
enableTelemetry: false

# Configuracao de rede para ambiente corporativo
# Descomentar se necessario proxy interno
# httpProxy: "http://proxy.staging.internal:3128"
# httpsProxy: "http://proxy.staging.internal:3128"
# noProxy: "harbor.staging.internal,gitlab.staging.internal"

nmMode: classic
