# =============================================================================
# ETL/Hatch/catalog-info.yaml — 12 Component entities do sistema data-hatch-etl
# Cada serviço é um Component independente no Backstage Catalog
# Namespace K8s: staging-data-hatch-etl (ADR-048)
#
# Serviços reais (8 Deployments K8s — CLAUDE.md Services Inventory):
#   1. api-gateway            — type: service
#   2. worker                 — type: service
#   3. etl-core               — type: service
#   4. dashboard              — type: service
#   5. web                    — type: frontend   [BCG-P0-02 ADICIONADO]
#   6. poller                 — type: worker     [BCG-P0-02 ADICIONADO]
#   7. prometheus-exporter    — type: worker     [BCG-P0-02 ADICIONADO]
#   8. anexos-service         — type: service    [BCG-P0-02 ADICIONADO]
#
# Jobs K8s:
#   9.  cronjob-etl-extraction — type: job
#   10. migration-runner       — type: job
#
# Entidades internas reclassificadas (não são Deployments K8s separados):
#   11. data-processor  — type: library [BCG-P1-08: lógica interna do etl-core]
#   12. scheduler       — type: library [BCG-P1-08: funcionalidade do CronJob K8s]
#
# Sprint S6-A / M2 — ADR-055, ADR-102, GAP-S6-10
# Sprint S6-D — Observability Links (Grafana, ArgoCD, Vault) — 2026-03-13
# BCG-P0-02 — 4 serviços ausentes adicionados — 2026-03-15
# BCG-P1-07 — vault-path: hatch/ → hatch-etl/ — 2026-03-15
# BCG-P2-02 — lifecycle: production → staging — 2026-03-15
# BCG-P1-08 — data-processor + scheduler reclassificados como library — 2026-03-15
# =============================================================================

