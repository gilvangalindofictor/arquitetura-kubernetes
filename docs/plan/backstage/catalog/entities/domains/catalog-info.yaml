# =============================================================================
# entities/domains/catalog-info.yaml — 5 Domain entities da plataforma
# Mapeamento: domínio → team owner → namespace padrão
# Convenção de namespace: staging-{domain}-{service} (ADR-048)
#
# Sprint S6-A / M2 — ADR-055, ADR-102
# =============================================================================

# ---------------------------------------------------------------------------
# Domínio 1: platform-core
# Owner: Platform Team
# Sistemas: backstage, argocd, keycloak, harbor, vault
# ---------------------------------------------------------------------------
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: platform-core
  title: "Platform Core"
  description: "Infraestrutura de plataforma — IDP, GitOps, Auth, Registry e Secrets Management"
  annotations:
    backstage.io/managed-by-location: "url:https://gitlab.staging.internal/platform/backstage-catalog/-/blob/main/entities/domains/catalog-info.yaml"
    backstage.io/techdocs-ref: "dir:."
  tags:
    - platform
    - idp
    - gitops
    - auth
    - secrets
spec:
  owner: platform-team

