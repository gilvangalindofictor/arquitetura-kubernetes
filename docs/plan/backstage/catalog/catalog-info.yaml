# =============================================================================
# catalog-info.yaml — Location entity raiz do Platform Catalog
# Registra todos os catálogos de domínios, sistemas e componentes
#
# Como usar:
#   Em app-config.yaml adicionar:
#     catalog:
#       locations:
#         - type: url
#           target: https://gitlab.staging.internal/platform/backstage-catalog/-/raw/main/catalog-info.yaml
#           rules:
#             - allow: [Location, Domain, System, Component, API, Group, User, Template]
#
# Sprint S6-A / M2 — ADR-055, ADR-102
# =============================================================================

apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: platform-catalog
  description: "Platform catalog root — aponta para todos os catálogos de domínio, sistema e componente"
  annotations:
    backstage.io/managed-by-location: "url:https://gitlab.staging.internal/platform/backstage-catalog/-/blob/main/catalog-info.yaml"
    backstage.io/source-location: "url:https://gitlab.staging.internal/platform/backstage-catalog/-/blob/main/"
spec:
  targets:
    # Domínios da plataforma (5 domínios: platform, integration, data, operations, shared-services)
    - ./entities/domains/catalog-info.yaml
    # Sistemas por domínio — data-hatch-etl
    - ./entities/systems/data/catalog-info.yaml
    # Component entities — 8 serviços ETL/Hatch
    - ./ETL/Hatch/catalog-info.yaml
    # Templates Golden Path (Scaffolder)
    - ./templates/catalog-info.yaml
