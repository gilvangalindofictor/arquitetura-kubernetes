# =============================================================================
# catalog-info.yaml — Location entity raiz do Platform Catalog
# Registra todos os catálogos de domínios, sistemas e templates
#
# Como usar:
#   Em app-config.yaml adicionar:
#     catalog:
#       locations:
#         - type: url
#           target: https://gitlab.staging.internal/platform/backstage-catalog/-/blob/main/catalog-info.yaml
#           rules:
#             - allow: [Location, Domain, System, Component, API, Group, User, Template]
#
# Sprint S6-A / M2 — ADR-055, ADR-102
# =============================================================================

apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: platform-catalog-root
  description: "Platform catalog root — aponta para todos os catálogos de domínio, sistema e template"
  annotations:
    backstage.io/managed-by-location: "url:https://gitlab.staging.internal/platform/backstage-catalog/-/blob/main/catalog-info.yaml"
    backstage.io/source-location: "url:https://gitlab.staging.internal/platform/backstage-catalog/-/blob/main/"
spec:
  targets:
    # Domínios da plataforma (5 domínios: platform-core, data-services, cicd-platform, observability, security)
    - ./entities/domains/catalog-info.yaml
    # Sistemas por domínio
    - ./entities/systems/data/catalog-info.yaml
    # Component entities de serviços existentes (GAP-S6-10)
    - ../../../../domains/data-services/catalog-info.yaml
    # Templates Golden Path (Scaffolder)
    - ../templates/catalog-info.yaml
