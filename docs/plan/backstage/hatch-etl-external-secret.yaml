# =============================================================================
# ExternalSecret para Hatch ETL — staging-data-hatch-etl
# =============================================================================
# GAP-VAULT-HATCH: Sincroniza secrets do Vault para o namespace da aplicacao.
# Executar junto com vault-setup-hatch-etl.sh (Fase 2 do playbook).
#
# Pre-requisitos:
#   - ClusterSecretStore "vault-backend" operacional
#   - Paths Vault criados via vault-setup-hatch-etl.sh
#   - Namespace staging-data-hatch-etl existente
#
# Aplicar:
#   kubectl apply -f hatch-etl-external-secret.yaml
#
# Verificar:
#   kubectl get externalsecret hatch-etl-secrets -n staging-data-hatch-etl
#   kubectl describe externalsecret hatch-etl-secrets -n staging-data-hatch-etl
#
# Vault paths cobertos (extraidos do manifest.yaml real):
#   secret/data/staging/hatch-etl/database  → DATABASE_URL, DATABASE_PASSWORD
#   secret/data/staging/hatch-etl/redis     → REDIS_URL, REDIS_PASSWORD
#   secret/data/staging/hatch-etl/keycloak  → KEYCLOAK_CLIENT_SECRET, KEYCLOAK_ADMIN_PASSWORD
#
# Ref: ETL/Hatch/.platform/manifest.yaml (config.secretKeys)
# Ref: ADR-104 (CI/CD Onboarding), ADR-047 (dominios), ADR-048 (naming)
# =============================================================================

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hatch-etl-secrets
  namespace: staging-data-hatch-etl
  labels:
    app.kubernetes.io/managed-by: platform-provisioner
    app.kubernetes.io/part-of: hatch-etl
    app.kubernetes.io/component: secrets
    platform.k8s/domain: data
    platform.k8s/env: staging
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore

  target:
    name: hatch-etl-secrets
    creationPolicy: Owner
    # deletionPolicy: Retain garante que o Secret K8s nao seja deletado se
    # o ExternalSecret for removido acidentalmente (protecao contra perda de dados)
    deletionPolicy: Retain

  data:
    # -------------------------------------------------------------------------
    # Database (PostgreSQL RDS)
    # Vault path: secret/data/staging/hatch-etl/database
    # -------------------------------------------------------------------------
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/data/staging/hatch-etl/database
        property: url

    - secretKey: DATABASE_PASSWORD
      remoteRef:
        key: secret/data/staging/hatch-etl/database
        property: password

    # -------------------------------------------------------------------------
    # Redis Sentinel (HA, 3 nodes)
    # Vault path: secret/data/staging/hatch-etl/redis
    # -------------------------------------------------------------------------
    - secretKey: REDIS_URL
      remoteRef:
        key: secret/data/staging/hatch-etl/redis
        property: url

    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: secret/data/staging/hatch-etl/redis
        property: password

    # -------------------------------------------------------------------------
    # Keycloak OIDC (client confidencial, realm "hatch")
    # Vault path: secret/data/staging/hatch-etl/keycloak
    # -------------------------------------------------------------------------
    - secretKey: KEYCLOAK_CLIENT_SECRET
      remoteRef:
        key: secret/data/staging/hatch-etl/keycloak
        property: client_secret

    - secretKey: KEYCLOAK_ADMIN_PASSWORD
      remoteRef:
        key: secret/data/staging/hatch-etl/keycloak
        property: admin_password

