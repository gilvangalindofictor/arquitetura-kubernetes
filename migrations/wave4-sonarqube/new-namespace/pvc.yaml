---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-sonarqube-sonarqube-0
  namespace: staging-platform-sonarqube
  labels:
    app: sonarqube
    release: sonarqube
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 20Gi
  dataSource:
    name: sonarqube-pvc-snapshot
    kind: VolumeSnapshot
    apiGroup: snapshot.storage.k8s.io
