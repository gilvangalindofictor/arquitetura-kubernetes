---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sonarqube-sonarqube-config
  namespace: staging-platform-sonarqube
  labels:
    app: sonarqube
    chart: sonarqube-10.7.0_3598
    heritage: Helm
    release: sonarqube
data:
  sonar.properties: "sonar.auth.gitlab.allowUsersToSignUp=false\nsonar.auth.gitlab.enabled=true\nsonar.auth.gitlab.groupsSyncEnabled=true\nsonar.auth.gitlab.url=http://gitlab.staging.internal\nsonar.auth.saml.applicationId=sonarqube\nsonar.auth.saml.certificate.\nsonar.auth.saml.enabled=true\nsonar.auth.saml.group.name=groups\nsonar.auth.saml.groupsSync=true\nsonar.auth.saml.loginUrl=http://keycloak.staging.internal/auth/realms/platform/protocol/saml\nsonar.auth.saml.providerId=http://keycloak.staging.internal/auth/realms/platform\nsonar.auth.saml.signature.enabled=true\nsonar.auth.saml.sp.certificate.\nsonar.auth.saml.user.email=email\nsonar.auth.saml.user.login=login\nsonar.auth.saml.user.name=name\nsonar.core.serverBaseURL=http://sonarqube.staging.internal\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sonarqube-sonarqube-init-fs
  namespace: staging-platform-sonarqube
  labels:
    app: sonarqube
    chart: sonarqube-10.7.0_3598
    heritage: Helm
    release: sonarqube
data:
  init_fs.sh: |-
    chown -R 1000:0 /opt/sonarqube/data
    chown -R 1000:0 /opt/sonarqube/temp
    chown -R 1000:0 /opt/sonarqube/logs
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sonarqube-sonarqube-init-sysctl
  namespace: staging-platform-sonarqube
  labels:
    app: sonarqube
    chart: sonarqube-10.7.0_3598
    heritage: Helm
    release: sonarqube
data:
  init_sysctl.sh: |-
    if [[ "$(sysctl -n vm.max_map_count)" -lt 524288 ]]; then
      sysctl -w vm.max_map_count=524288
    fi
    if [[ "$(sysctl -n fs.file-max)" -lt 131072 ]]; then
      sysctl -w fs.file-max=131072
    fi
    if [[ "$(ulimit -n)" != "unlimited" ]]; then
      if [[ "$(ulimit -n)" -lt 131072 ]]; then
        echo "ulimit -n 131072"
        ulimit -n 131072
      fi
    fi
    if [[ "$(ulimit -u)" != "unlimited" ]]; then
      if [[ "$(ulimit -u)" -lt 8192 ]]; then
        echo "ulimit -u 8192"
        ulimit -u 8192
      fi
    fi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sonarqube-sonarqube-install-plugins
  namespace: staging-platform-sonarqube
  labels:
    app: sonarqube
    chart: sonarqube-10.7.0_3598
    heritage: Helm
    release: sonarqube
data:
  install_plugins.sh: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sonarqube-sonarqube-jdbc-config
  namespace: staging-platform-sonarqube
  labels:
    app: sonarqube
    chart: sonarqube-10.7.0_3598
    heritage: Helm
    release: sonarqube
data:
  SONAR_JDBC_URL: jdbc:postgresql://k8s-platform-prod-postgresql.cw9kqksocqv1.us-east-1.rds.amazonaws.com:5432/sonarqube
  SONAR_JDBC_USERNAME: sonarqube_user
