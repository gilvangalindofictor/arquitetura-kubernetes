apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak-keycloakx
  namespace: staging-platform-keycloak
  labels:
    app.kubernetes.io/instance: keycloak
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: keycloakx
    app.kubernetes.io/version: 26.5.1
    helm.sh/chart: keycloakx-7.1.7
  annotations:
    meta.helm.sh/release-name: keycloak
    meta.helm.sh/release-namespace: staging-platform-keycloak
spec:
  replicas: 1
  serviceName: keycloak-keycloakx-headless
  selector:
    matchLabels:
      app.kubernetes.io/instance: keycloak
      app.kubernetes.io/name: keycloakx
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: keycloak
        app.kubernetes.io/name: keycloakx
      annotations:
        checksum/config-startup: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
        checksum/secrets: 44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a
    spec:
      serviceAccountName: keycloak-keycloakx
      securityContext:
        fsGroup: 1000
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/instance: keycloak
                app.kubernetes.io/name: keycloakx
              matchExpressions:
              - key: app.kubernetes.io/component
                operator: NotIn
                values:
                - test
            topologyKey: kubernetes.io/hostname
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: keycloak
                  app.kubernetes.io/name: keycloakx
                matchExpressions:
                - key: app.kubernetes.io/component
                  operator: NotIn
                  values:
                  - test
              topologyKey: topology.kubernetes.io/zone
      tolerations:
      - key: workload
        operator: Equal
        value: critical
        effect: NoSchedule
      initContainers:
      - name: wait-for-db
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          echo "Waiting for PostgreSQL..."
          until nc -z postgresql-external.default.svc.cluster.local 5432; do
            echo "DB not ready, retrying in 5s..."
            sleep 5
          done
          echo "DB is ready!"
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:26.5.1
        imagePullPolicy: IfNotPresent
        command:
        - /opt/keycloak/bin/kc.sh
        - start
        - --http-relative-path=/auth
        - --health-enabled=true
        env:
        - name: KC_HTTP_RELATIVE_PATH
          value: /auth
        - name: KC_CACHE
          value: ispn
        - name: KC_CACHE_STACK
          value: jdbc-ping
        - name: KC_PROXY_HEADERS
          value: forwarded
        - name: KC_HTTP_ENABLED
          value: "true"
        - name: KC_METRICS_ENABLED
          value: "true"
        - name: KC_HEALTH_ENABLED
          value: "true"
        - name: KEYCLOAK_ADMIN
          value: admin
        - name: KEYCLOAK_ADMIN_PASSWORD
          value: Qq!Tp?Q=xmCmj5zGbzIW>kno
        - name: KC_DB
          value: postgres
        - name: KC_DB_URL_HOST
          valueFrom:
            secretKeyRef:
              name: keycloak-postgresql-credentials
              key: host
        - name: KC_DB_URL_PORT
          valueFrom:
            secretKeyRef:
              name: keycloak-postgresql-credentials
              key: port
        - name: KC_DB_URL_DATABASE
          valueFrom:
            secretKeyRef:
              name: keycloak-postgresql-credentials
              key: database
        - name: KC_DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: keycloak-postgresql-credentials
              key: username
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-postgresql-credentials
              key: password
        - name: KC_DB_URL_PROPERTIES
          value: ?sslmode=require
        - name: KC_PROXY
          value: edge
        - name: KC_HOSTNAME_STRICT
          value: "false"
        - name: KC_LOG_LEVEL
          value: INFO
        - name: KC_HTTP_MANAGEMENT_HEALTH_ENABLED
          value: "false"
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          value: bootstrap_admin
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          value: BootstrapAdmin123!
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: http-internal
          containerPort: 9000
          protocol: TCP
        - name: https
          containerPort: 8443
          protocol: TCP
        resources:
          requests:
            cpu: 200m
            memory: 681Mi
          limits:
            cpu: "1"
            memory: 2724Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
        startupProbe:
          httpGet:
            path: /auth/health/ready
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /auth/health/live
            port: 8080
            scheme: HTTP
          periodSeconds: 30
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /auth/health/ready
            port: 8080
            scheme: HTTP
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 5
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
