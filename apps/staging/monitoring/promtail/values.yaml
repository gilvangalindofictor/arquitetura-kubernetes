---
# Promtail configuration for staging observability
# Deploys log shipper to send pod logs to Loki

config:
  # Loki endpoint configuration
  clients:
    - url: http://loki-gateway.staging-observability-monitoring.svc.cluster.local/loki/api/v1/push
      tenant_id: ""

  # Use default Kubernetes pod log scraping with namespace filtering
  snippets:
    extraScrapeConfigs: |
      - job_name: kubernetes-pods-name
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - tracing-test
                - staging-observability-monitoring
        pipeline_stages:
          - cri: {}
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_label_app
            target_label: app
          - source_labels:
              - __meta_kubernetes_pod_node_name
            target_label: node_name
          - source_labels:
              - __meta_kubernetes_namespace
            target_label: namespace
          - source_labels:
              - __meta_kubernetes_pod_name
            target_label: pod
          - source_labels:
              - __meta_kubernetes_pod_container_name
            target_label: container
          - replacement: /var/log/pods/*$1/*.log
            separator: /
            source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_pod_container_name
            target_label: __path__

# Corporate labels (Kyverno policy compliance - ADR-048)
podLabels:
  domain: platform
  owner: platform-team
  environment: staging
  app.kubernetes.io/name: promtail
  app.kubernetes.io/part-of: observability
  app.kubernetes.io/managed-by: helm

# Resource limits
resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

# Deploy on any node (system nodes at capacity)
# Will preferentially schedule on nodes with available capacity
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 50
        preference:
          matchExpressions:
            - key: node-type
              operator: In
              values:
                - system

tolerations:
  - key: node-type
    operator: Equal
    value: system
    effect: NoSchedule
  - key: node-type
    operator: Equal
    value: workload
    effect: NoSchedule

# ServiceMonitor for Prometheus
serviceMonitor:
  enabled: true
  namespace: staging-observability-monitoring
  labels:
    release: kube-prometheus-stack

# Run as DaemonSet
daemonset:
  enabled: true
