# =============================================================================
# Preset: API REST
# =============================================================================
# Mesa Tecnica P1 — Valores baseados em consumo real do cluster
# Staging multiplier: 0.5x CPU req, 0.75x mem req, min 1 replica
# Ref: ADR-104, 2026-03-11
# =============================================================================

type: api-rest
description: "Preset para APIs RESTful — baixo consumo, alta disponibilidade"

environments:
  production:
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "400m"
        memory: "512Mi"
    replicas:
      min: 2
      max: 8
    hpa:
      enabled: true
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80

  staging:
    resources:
      requests:
        cpu: "50m"        # 0.5x de 100m
        memory: "96Mi"    # 0.75x de 128Mi
      limits:
        cpu: "400m"
        memory: "512Mi"
    replicas:
      min: 1
      max: 4
    hpa:
      enabled: true
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: 85

defaults:
  port: 8080
  healthCheck:
    liveness: "/health"
    readiness: "/ready"
  probeInitialDelay: 15
  terminationGracePeriod: 30
