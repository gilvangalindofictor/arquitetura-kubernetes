# =============================================================================
# Preset: Frontend (SPA / SSR)
# =============================================================================
# Mesa Tecnica P1 — Valores baseados em consumo real do cluster
# Staging multiplier: 0.5x CPU req, 0.75x mem req, min 1 replica
# Ref: ADR-104, 2026-03-11
# =============================================================================

type: frontend
description: "Preset para frontends — baixo consumo CPU/mem, alta disponibilidade"

environments:
  production:
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"
    replicas:
      min: 2
      max: 6
    hpa:
      enabled: true
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80

  staging:
    resources:
      requests:
        cpu: "25m"        # 0.5x de 50m
        memory: "48Mi"    # 0.75x de 64Mi
      limits:
        cpu: "200m"
        memory: "256Mi"
    replicas:
      min: 1
      max: 3
    hpa:
      enabled: true
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: 85

defaults:
  port: 3000
  healthCheck:
    liveness: "/health"
    readiness: "/"
  probeInitialDelay: 10
  terminationGracePeriod: 15
