# =============================================================================
# GAP-011: Linkerd Proxy Injection — Patch Namespace staging-platform
# =============================================================================
# Conteudo: Keycloak, Vault, ArgoCD
# Fase: 1 (menor risco — autenticacao/autorizacao nao sao latency-sensitive)
# Impacto esperado: +<1ms P99 por hop (Linkerd2-proxy Rust overhead)
#
# Como aplicar:
#   kubectl patch namespace staging-platform --patch-file staging-platform-linkerd-patch.yaml
#   # Ou via kustomize:
#   kubectl apply -k ../
#
# Como verificar:
#   kubectl get ns staging-platform -o jsonpath='{.metadata.annotations}'
#   linkerd viz stat deploy -n staging-platform
#
# Rollback:
#   kubectl annotate namespace staging-platform linkerd.io/inject- --overwrite
#   kubectl rollout restart deployment -n staging-platform
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: staging-platform
  annotations:
    linkerd.io/inject: "enabled"
  labels:
    # Labels corporativos obrigatorios (Kyverno enforce)
    environment: staging
    team: platform
    cost-center: "plataforma-k8s"
    # Label de rastreabilidade GAP
    gap: "GAP-011"
    compliance: "bcb-85-2021"
