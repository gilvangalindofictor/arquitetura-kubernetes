---
# GitLab Runner Egress Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gitlab-runner-egress
  namespace: gitlab-staging
  annotations:
    policy.cilium.io/audit-mode: "true"
    description: "Allow egress from GitLab runners to required services (audit mode)"
    gap: "GAP-007"
    phase: "audit"
    enforced-after: "2026-03-03"
spec:
  podSelector:
    matchLabels:
      app: gitlab-gitlab-runner
  policyTypes:
  - Egress
  egress:
  # Allow to GitLab Webservice (job polling)
  - to:
    - podSelector:
        matchLabels:
          app: webservice
    ports:
    - protocol: TCP
      port: 8181
  # Allow to Harbor registry
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: harbor-system
      podSelector:
        matchLabels:
          app: harbor
          component: registry
    ports:
    - protocol: TCP
      port: 5000
  # Allow to SonarQube
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: sonarqube
      podSelector:
        matchLabels:
          app: sonarqube
    ports:
    - protocol: TCP
      port: 9000
  # Allow to Kubernetes API and Internet (for docker images, dependencies)
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 169.254.169.254/32
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
