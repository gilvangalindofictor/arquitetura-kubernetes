---
# Keycloak Ingress Policy
# LABEL CORRECTION (2026-02-24):
#   Actual pod label: app.kubernetes.io/name: keycloakx  (Helm chart keycloakx)
#   NOT: app.kubernetes.io/name: keycloak
#
# Allows:
#   - ALB Ingress Controller → keycloak:8080
#   - ArgoCD → keycloak:8080 (OIDC client)
#   - SonarQube → keycloak:8080 (SAML client)
#   - GitLab webservice → keycloak:8080 (OIDC client)
#   - Grafana → keycloak:8080 (OIDC client)
#   - Harbor core → keycloak:8080 (OIDC client)
#   - Vault → keycloak:8080 (OIDC client)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-ingress
  namespace: keycloak
  annotations:
    policy.cilium.io/audit-mode: "true"
    description: "Allow ingress to Keycloak from ALB and SSO clients (audit mode)"
    gap: "GAP-007"
    phase: "audit"
    enforced-after: "2026-03-03"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloakx
  policyTypes:
  - Ingress
  ingress:
  # Allow from ALB Ingress Controller (kube-system)
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: aws-load-balancer-controller
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8443
    - protocol: TCP
      port: 9000
  # Allow from ArgoCD server (OIDC)
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: argocd
      podSelector:
        matchLabels:
          app.kubernetes.io/name: argocd-server
    ports:
    - protocol: TCP
      port: 8080
  # Allow from SonarQube (SAML)
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: sonarqube
      podSelector:
        matchLabels:
          app: sonarqube
    ports:
    - protocol: TCP
      port: 8080
  # Allow from GitLab webservice (OIDC)
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: gitlab-staging
      podSelector:
        matchLabels:
          app: webservice
    ports:
    - protocol: TCP
      port: 8080
  # Allow from Grafana (OIDC)
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: grafana
    ports:
    - protocol: TCP
      port: 8080
  # Allow from Harbor core (OIDC) - actual label: app=harbor, component=core
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: harbor-system
      podSelector:
        matchLabels:
          app: harbor
          component: core
    ports:
    - protocol: TCP
      port: 8080
  # Allow from Vault (staging-security-vault namespace, OIDC)
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: staging-security-vault
      podSelector:
        matchLabels:
          app.kubernetes.io/name: vault
    ports:
    - protocol: TCP
      port: 8080
  # Allow Prometheus scraping metrics port
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 9000

---
# Keycloak Egress Policy
# Allows:
#   - keycloak → PostgreSQL RDS:5432 (external database, VPC CIDR)
#   - keycloak → DNS:53 (kube-dns)
#   - keycloak → Internet:443/80 (external IdPs, LDAP, email SMTP)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-egress
  namespace: keycloak
  annotations:
    policy.cilium.io/audit-mode: "true"
    description: "Allow egress from Keycloak to RDS, DNS, and external services (audit mode)"
    gap: "GAP-007"
    phase: "audit"
    enforced-after: "2026-03-03"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloakx
  policyTypes:
  - Egress
  egress:
  # Allow to PostgreSQL RDS (VPC CIDR 10.0.0.0/8)
  - to:
    - ipBlock:
        cidr: 10.0.0.0/8
    ports:
    - protocol: TCP
      port: 5432
  # Allow to Internet for external IdPs (GitLab Social IdP), SMTP, LDAP
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 169.254.169.254/32  # Block AWS IMDS
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 587   # SMTP STARTTLS (email)
    - protocol: TCP
      port: 465   # SMTP SSL
    - protocol: TCP
      port: 636   # LDAPS
  # Allow DNS resolution (CoreDNS in kube-system)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

---
# Keycloak Cluster Communication (JGroups for HA)
# Allows Keycloak pods to communicate for active/passive failover
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-cluster-communication
  namespace: keycloak
  annotations:
    policy.cilium.io/audit-mode: "true"
    description: "Allow Keycloak pods JGroups clustering communication (audit mode)"
    gap: "GAP-007"
    phase: "audit"
    enforced-after: "2026-03-03"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloakx
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # JGroups TCP clustering
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: keycloakx
    ports:
    - protocol: TCP
      port: 7600
    - protocol: UDP
      port: 55200
  egress:
  # JGroups TCP clustering
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: keycloakx
    ports:
    - protocol: TCP
      port: 7600
    - protocol: UDP
      port: 55200
