# =============================================================================
# CICD-003: Secret Rotation Observability
# PrometheusRule CRD for kube-prometheus-stack
# Cluster: k8s-platform-prod (EKS, us-east-1)
#
# Alerts:
#   - SecretRotationFailed           (critical) — CronJob last run failed
#   - SecretRotationNotRun           (warning)  — CronJob not completed in >95 days
#   - SecretRotationCronJobMissing   (warning)  — CronJob resource does not exist
#   - SecretAgeExceeded              (warning)  — secret older than 100 days
#   - SecretRotationPartialFailure   (warning)  — CronJob had errors but did not fully fail
#
# Metrics used:
#   - kube_cronjob_status_last_successful_time   (kube-state-metrics)
#   - kube_cronjob_status_active                 (kube-state-metrics)
#   - kube_job_status_failed                     (kube-state-metrics)
#   - kube_job_status_succeeded                  (kube-state-metrics)
#   - kube_cronjob_info                          (kube-state-metrics)
# =============================================================================
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cicd003-secret-rotation-alerts
  namespace: staging-observability-monitoring
  labels:
    app: kube-prometheus-stack
    release: kube-prometheus-stack
    prometheus: kube-prometheus-stack-prometheus
    role: alert-rules
    app.kubernetes.io/name: secret-rotation-alerts
    app.kubernetes.io/component: alerting-rules
    app.kubernetes.io/managed-by: terraform
    demand: CICD-003
    team: platform-sre
spec:
  groups:
    # =========================================================================
    # Group: CronJob Execution Health
    # Monitors the secret-rotator CronJob execution status
    # =========================================================================
    - name: security.secret-rotation.execution
      interval: 300s  # Check every 5 minutes (rotation is infrequent)
      rules:
        # -----------------------------------------------------------------
        # SecretRotationFailed
        # The most recent Job spawned by the CronJob ended in failure.
        # Fires if any job associated with secret-rotator has failed.
        # Severity: critical — rotation failures expose stale/expired credentials
        # -----------------------------------------------------------------
        - alert: SecretRotationFailed
          expr: |
            kube_job_status_failed{
              job_name=~"secret-rotator.*",
              namespace="staging-security-vault"
            } > 0
          for: 5m
          labels:
            severity: critical
            team: platform-sre
            service: secret-rotation
            component: cronjob
            demand: CICD-003
          annotations:
            summary: "CRITICAL: Secret rotation job '{{ $labels.job_name }}' FAILED"
            description: |
              The secret rotation CronJob has failed in namespace {{ $labels.namespace }}.

              This means platform credentials (PostgreSQL passwords, Keycloak admin,
              OIDC client secrets) have NOT been rotated as scheduled.

              Security Impact: Credentials older than 90 days violate the rotation
              policy defined in ADR-083 and docs/runbooks/secret-rotation-policy.md

              Immediate Actions:
              1. Check CronJob logs:
                 kubectl logs -n staging-security-vault -l app.kubernetes.io/name=secret-rotator --tail=200
              2. Check Job status:
                 kubectl get jobs -n staging-security-vault | grep secret-rotator
              3. Describe failed Job:
                 kubectl describe job {{ $labels.job_name }} -n {{ $labels.namespace }}
              4. Run emergency manual rotation if needed:
                 See: docs/runbooks/secret-rotation-emergency-manual.md
              5. After fixing, trigger manual rotation:
                 kubectl create job --from=cronjob/secret-rotator secret-rotator-manual-fix -n staging-security-vault

              Runbook: docs/runbooks/secret-rotation-troubleshooting.md

        # -----------------------------------------------------------------
        # SecretRotationNotRun
        # The CronJob has not completed successfully in >95 days.
        # Fires if last_successful_time is more than 95 days ago.
        # 95 days = 90-day schedule + 5-day grace window.
        # Severity: warning — approaching policy violation
        # -----------------------------------------------------------------
        - alert: SecretRotationNotRun
          expr: |
            (
              time() - kube_cronjob_status_last_successful_time{
                cronjob="secret-rotator",
                namespace="staging-security-vault"
              }
            ) / 86400 > 95
          for: 1h
          labels:
            severity: warning
            team: platform-sre
            service: secret-rotation
            component: cronjob
            demand: CICD-003
          annotations:
            summary: "WARNING: Secret rotation has not run successfully in {{ $value | printf \"%.0f\" }} days"
            description: |
              The secret-rotator CronJob in namespace {{ $labels.namespace }} has not
              completed successfully in {{ $value | printf "%.0f" }} days.

              The rotation schedule is quarterly (every ~91 days). After 95 days
              without a successful run, credentials are approaching the policy
              violation threshold.

              Investigation:
              1. Check CronJob schedule: kubectl get cronjob secret-rotator -n staging-security-vault
              2. Check recent job history: kubectl get jobs -n staging-security-vault
              3. Check for suspended status: kubectl get cronjob secret-rotator -n staging-security-vault -o jsonpath='{.spec.suspend}'
              4. Trigger manual rotation: kubectl create job --from=cronjob/secret-rotator secret-rotator-manual -n staging-security-vault

              Runbook: docs/runbooks/secret-rotation-troubleshooting.md

        # -----------------------------------------------------------------
        # SecretRotationCronJobMissing
        # The CronJob resource itself does not exist in kube-state-metrics.
        # Could indicate accidental deletion or Terraform drift.
        # Severity: warning
        # -----------------------------------------------------------------
        - alert: SecretRotationCronJobMissing
          expr: |
            absent(kube_cronjob_info{
              cronjob="secret-rotator",
              namespace="staging-security-vault"
            })
          for: 30m
          labels:
            severity: warning
            team: platform-sre
            service: secret-rotation
            component: cronjob
            demand: CICD-003
          annotations:
            summary: "WARNING: secret-rotator CronJob is missing from namespace staging-security-vault"
            description: |
              The secret-rotator CronJob resource was not found in namespace staging-security-vault.

              This could indicate:
              - Accidental deletion of the CronJob
              - Terraform state drift
              - Namespace was recreated without re-applying Terraform

              Actions:
              1. Check if CronJob exists: kubectl get cronjob -n staging-security-vault
              2. Re-apply Terraform: terraform apply -target=kubernetes_cron_job_v1.secret_rotator
              3. Check namespace: kubectl get ns staging-security-vault

              Runbook: docs/runbooks/secret-rotation-troubleshooting.md

        # -----------------------------------------------------------------
        # SecretRotationRunning
        # Informational: rotation is currently in progress.
        # Not an alert — used for dashboards and long-run detection.
        # -----------------------------------------------------------------
        - alert: SecretRotationRunningTooLong
          expr: |
            kube_cronjob_status_active{
              cronjob="secret-rotator",
              namespace="staging-security-vault"
            } > 0
            and
            (
              time() - kube_job_status_start_time{
                job_name=~"secret-rotator.*",
                namespace="staging-security-vault"
              }
            ) > 2400
          for: 5m
          labels:
            severity: warning
            team: platform-sre
            service: secret-rotation
            component: cronjob
            demand: CICD-003
          annotations:
            summary: "WARNING: Secret rotation job has been running for more than 40 minutes"
            description: |
              The secret-rotator Job has been active for more than 40 minutes.
              The expected runtime is 5-15 minutes. This may indicate:

              - Script is hanging on a connectivity issue (Vault, RDS, Keycloak)
              - CronJob pod is in a crash loop (check restartPolicy)
              - Resource constraints causing slow execution

              The Job will be auto-killed after 30 minutes (activeDeadlineSeconds: 1800).

              Actions:
              1. Check pod status: kubectl get pods -n staging-security-vault -l app.kubernetes.io/name=secret-rotator
              2. Check pod logs: kubectl logs -n staging-security-vault -l app.kubernetes.io/name=secret-rotator --tail=100
              3. Describe pod for events: kubectl describe pod -n staging-security-vault -l app.kubernetes.io/name=secret-rotator

    # =========================================================================
    # Group: Secret Age Monitoring
    # Tracks how long since secrets were last rotated using Vault metadata.
    # Requires vault_secret_kv_version_metadata metric (Vault exporter).
    # If Vault exporter is not installed, these alerts will not fire.
    # =========================================================================
    - name: security.secret-rotation.age
      interval: 3600s  # Check every hour (age changes slowly)
      rules:
        # -----------------------------------------------------------------
        # SecretAgeExceeded
        # A tracked secret in Vault has not been updated in >100 days.
        # Indicates the rotation CronJob ran but failed for this specific secret,
        # OR the rotation was not triggered.
        # Severity: warning
        #
        # Metric: vault_kv_secret_version_created_time_seconds (from vault-exporter)
        # If using kube-prometheus-stack without vault-exporter, comment this out
        # and rely on SecretRotationNotRun instead.
        # -----------------------------------------------------------------
        - alert: SecretAgeExceeded
          expr: |
            (
              time() - vault_kv_secret_version_created_time_seconds{
                path=~"secret/(keycloak|gitlab|harbor|sonarqube|grafana|argocd|vault)/(postgresql|admin|oidc|saml)"
              }
            ) / 86400 > 100
          for: 2h
          labels:
            severity: warning
            team: platform-sre
            service: secret-rotation
            component: vault-secret
            demand: CICD-003
          annotations:
            summary: "WARNING: Vault secret '{{ $labels.path }}' has not been rotated in {{ $value | printf \"%.0f\" }} days"
            description: |
              The Vault KV secret at path {{ $labels.path }} has not been updated
              in {{ $value | printf "%.0f" }} days (threshold: 100 days).

              The rotation policy requires quarterly rotation (90 days).
              This secret is now overdue for rotation.

              Actions:
              1. Check last rotation: vault kv metadata get {{ $labels.path }}
              2. Check rotation history: vault kv get secret/secret-rotator/last-rotation
              3. Trigger targeted rotation:
                 kubectl set env cronjob/secret-rotator ROTATE_ONLY=postgresql -n staging-security-vault
                 kubectl create job --from=cronjob/secret-rotator secret-rotator-targeted -n staging-security-vault

              Runbook: docs/runbooks/secret-rotation-troubleshooting.md#specific-secret-rotation
