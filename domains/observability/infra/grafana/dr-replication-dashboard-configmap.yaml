---
# =============================================================================
# ConfigMap: DR Multi-Region Status Dashboard
# GAP-012: Velero Backup/DR Multi-Region monitoring
# =============================================================================
# Panels:
#   1. S3 ReplicationPendingOperations  — CRR operations not yet replicated
#   2. S3 BytesPendingReplication       — Data volume pending replication
#   3. S3 OperationsFailedReplication   — CRR failures (critical alert)
#   4. RDS ReplicaLag                   — Phase 2: read replica lag (us-west-2)
#   5. Velero Last Successful Backup    — Last successful backup timestamp per schedule
#
# Usage:
#   kubectl apply -f dr-replication-dashboard-configmap.yaml
#   Dashboard auto-imported by Grafana sidecar (grafana_dashboard="1")
#
# Datasource requirements:
#   - CloudWatch datasource configured in Grafana (AWS credentials via IRSA)
#   - Prometheus datasource (for Velero metrics from kube-prometheus-stack)
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: dr-multi-region-status-dashboard
  namespace: staging-observability-monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: kube-prometheus-stack
    app.kubernetes.io/component: dashboard
    environment: staging
    domain: backup-dr
    gap: gap-012
  annotations:
    description: "DR Multi-Region Status — S3 CRR replication metrics + Velero backup health"
    gap: "GAP-012"
    adr: "ADR-078"
    created: "2026-03-04"
    owner: "platform-team"
data:
  dr-multi-region-status.json: |-
    {
      "__inputs": [
        {
          "name": "DS_CLOUDWATCH",
          "label": "CloudWatch",
          "description": "AWS CloudWatch datasource for S3 CRR and RDS metrics",
          "type": "datasource",
          "pluginId": "cloudwatch",
          "pluginName": "CloudWatch"
        },
        {
          "name": "DS_PROMETHEUS",
          "label": "Prometheus",
          "description": "Prometheus datasource for Velero metrics",
          "type": "datasource",
          "pluginId": "prometheus",
          "pluginName": "Prometheus"
        }
      ],
      "__requires": [
        {
          "type": "grafana",
          "id": "grafana",
          "name": "Grafana",
          "version": "9.0.0"
        },
        {
          "type": "datasource",
          "id": "cloudwatch",
          "name": "CloudWatch",
          "version": "1.0.0"
        },
        {
          "type": "datasource",
          "id": "prometheus",
          "name": "Prometheus",
          "version": "1.0.0"
        },
        {
          "type": "panel",
          "id": "timeseries",
          "name": "Time series",
          "version": ""
        },
        {
          "type": "panel",
          "id": "stat",
          "name": "Stat",
          "version": ""
        },
        {
          "type": "panel",
          "id": "gauge",
          "name": "Gauge",
          "version": ""
        }
      ],
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": "-- Grafana --",
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "DR Multi-Region Status Dashboard — S3 CRR replication health + RDS replica lag + Velero backup schedules",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 10,
          "title": "S3 CRR — Replication Health (us-east-1 to us-west-2)",
          "type": "row"
        },
        {
          "datasource": { "type": "cloudwatch", "uid": "${DS_CLOUDWATCH}" },
          "description": "Number of S3 replication operations that are pending (not yet replicated to us-west-2). High values indicate replication lag. Target: < 100 operations pending.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 50 },
                  { "color": "red", "value": 200 }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 1 },
          "id": 1,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "9.0.0",
          "targets": [
            {
              "alias": "Pending Operations",
              "datasource": { "type": "cloudwatch", "uid": "${DS_CLOUDWATCH}" },
              "dimensions": {
                "SourceBucket": "velero-backups-staging-891377105802-us-east-1",
                "DestinationBucket": "velero-backups-staging-891377105802-us-west-2",
                "RuleId": "velero-backup-replication"
              },
              "expression": "",
              "highResolution": false,
              "id": "",
              "matchExact": true,
              "metricName": "ReplicationPendingOperations",
              "namespace": "AWS/S3",
              "period": "300",
              "refId": "A",
              "region": "us-east-1",
              "statistics": ["Average"]
            }
          ],
          "title": "Pending Replication Operations",
          "type": "stat"
        },
        {
          "datasource": { "type": "cloudwatch", "uid": "${DS_CLOUDWATCH}" },
          "description": "Total bytes of S3 objects pending replication to us-west-2. Values above 1 GB trigger the CloudWatch alarm (RTC 15-min SLA at risk). Target: < 500 MB.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 524288000 },
                  { "color": "red", "value": 1073741824 }
                ]
              },
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 1 },
          "id": 2,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "9.0.0",
          "targets": [
            {
              "alias": "Bytes Pending",
              "datasource": { "type": "cloudwatch", "uid": "${DS_CLOUDWATCH}" },
              "dimensions": {
                "SourceBucket": "velero-backups-staging-891377105802-us-east-1",
                "DestinationBucket": "velero-backups-staging-891377105802-us-west-2",
                "RuleId": "velero-backup-replication"
              },
              "expression": "",
              "highResolution": false,
              "id": "",
              "matchExact": true,
              "metricName": "BytesPendingReplication",
              "namespace": "AWS/S3",
              "period": "300",
              "refId": "A",
              "region": "us-east-1",
              "statistics": ["Maximum"]
            }
          ],
          "title": "Bytes Pending Replication",
          "type": "stat"
        },
        {
          "datasource": { "type": "cloudwatch", "uid": "${DS_CLOUDWATCH}" },
          "description": "Number of S3 replication operations that FAILED. Any value > 0 is a critical alert — DR integrity is at risk. Target: 0 always.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [
                { "options": { "0": { "color": "green", "index": 0, "text": "OK" } }, "type": "value" }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 1 },
          "id": 3,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["sum"],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "9.0.0",
          "targets": [
            {
              "alias": "Failed Operations",
              "datasource": { "type": "cloudwatch", "uid": "${DS_CLOUDWATCH}" },
              "dimensions": {
                "SourceBucket": "velero-backups-staging-891377105802-us-east-1",
                "DestinationBucket": "velero-backups-staging-891377105802-us-west-2",
                "RuleId": "velero-backup-replication"
              },
              "expression": "",
              "highResolution": false,
              "id": "",
              "matchExact": true,
              "metricName": "OperationsFailedReplication",
              "namespace": "AWS/S3",
              "period": "3600",
              "refId": "A",
              "region": "us-east-1",
              "statistics": ["Sum"]
            }
          ],
          "title": "Failed Replication Operations (1h Sum)",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 9 },
          "id": 11,
          "title": "RDS Replica Lag (Phase 2 — us-west-2)",
          "type": "row"
        },
        {
          "datasource": { "type": "cloudwatch", "uid": "${DS_CLOUDWATCH}" },
          "description": "RDS read replica lag in us-west-2 (GAP-012 Phase 2). Phase 2 activates when vpc-dr module is deployed and rds-replica count > 0. Current value = 0 indicates Phase 2 not yet active.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [
                { "options": { "0": { "color": "blue", "index": 0, "text": "Phase 2 Pending" } }, "type": "value" }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 30 },
                  { "color": "red", "value": 120 }
                ]
              },
              "unit": "s",
              "min": 0
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 10 },
          "id": 4,
          "options": {
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "pluginVersion": "9.0.0",
          "targets": [
            {
              "alias": "Replica Lag (s)",
              "datasource": { "type": "cloudwatch", "uid": "${DS_CLOUDWATCH}" },
              "dimensions": {
                "DBInstanceIdentifier": "k8s-platform-staging-postgres-replica-us-west-2"
              },
              "expression": "",
              "highResolution": false,
              "id": "",
              "matchExact": false,
              "metricName": "ReplicaLag",
              "namespace": "AWS/RDS",
              "period": "60",
              "refId": "A",
              "region": "us-west-2",
              "statistics": ["Average"]
            }
          ],
          "title": "RDS Replica Lag — us-west-2 (Phase 2)",
          "type": "gauge"
        },
        {
          "datasource": { "type": "cloudwatch", "uid": "${DS_CLOUDWATCH}" },
          "description": "RDS replica lag trend over time. Sustained lag > 120s indicates replication pressure or network issues between us-east-1 and us-west-2.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "Lag (seconds)",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "none",
                "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "pointSize": 5,
                "scaleDistribution": { "type": "linear" },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" },
                "thresholdsStyle": { "mode": "line" }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 30 },
                  { "color": "red", "value": 120 }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 10 },
          "id": 5,
          "options": {
            "legend": { "calcs": ["mean", "max"], "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "targets": [
            {
              "alias": "Replica Lag",
              "datasource": { "type": "cloudwatch", "uid": "${DS_CLOUDWATCH}" },
              "dimensions": {
                "DBInstanceIdentifier": "k8s-platform-staging-postgres-replica-us-west-2"
              },
              "expression": "",
              "highResolution": false,
              "id": "",
              "matchExact": false,
              "metricName": "ReplicaLag",
              "namespace": "AWS/RDS",
              "period": "60",
              "refId": "A",
              "region": "us-west-2",
              "statistics": ["Average"]
            }
          ],
          "title": "RDS Replica Lag — Trend (Phase 2)",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 18 },
          "id": 12,
          "title": "Velero Backup Schedules — Health",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "description": "Time since the last successful backup per schedule. Values > 25h for daily-full-backup or > 90min for hourly-incremental-backup indicate a problem. Source: Velero Prometheus metrics.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 90000 },
                  { "color": "red", "value": 172800 }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 19 },
          "id": 6,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "9.0.0",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "time() - velero_backup_last_successful_timestamp{schedule=~\"daily-full-backup|hourly-incremental-backup\"}",
              "instant": false,
              "interval": "",
              "legendFormat": "{{schedule}}",
              "refId": "A"
            }
          ],
          "title": "Time Since Last Successful Backup",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "description": "Velero backup failure count per schedule. Any non-zero value requires immediate investigation. Check Velero logs: kubectl logs -n velero -l app.kubernetes.io/name=velero",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [
                { "options": { "0": { "color": "green", "index": 0, "text": "No Failures" } }, "type": "value" }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 19 },
          "id": 7,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": ["sum"],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "9.0.0",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "increase(velero_backup_failure_total{schedule=~\"daily-full-backup|hourly-incremental-backup\"}[24h])",
              "instant": false,
              "interval": "",
              "legendFormat": "{{schedule}}",
              "refId": "A"
            }
          ],
          "title": "Backup Failures (Last 24h)",
          "type": "stat"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 36,
      "style": "dark",
      "tags": ["dr", "backup", "velero", "s3-crr", "rds", "gap-012"],
      "templating": { "list": [] },
      "time": { "from": "now-6h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "DR Multi-Region Status",
      "uid": "dr-multi-region-status",
      "version": 1
    }
