# =============================================================================
# Grafana Dashboard: RDS PostgreSQL Monitoring
# =============================================================================
# Purpose: Unified dashboard for RDS availability and performance monitoring
# Data Sources: CloudWatch (RDS metrics), Prometheus (K8s pod health)
#
# Dashboard Features:
#   - RDS instance status (running/stopped)
#   - Database connections (current vs max)
#   - CPU/Memory/Storage utilization
#   - Read/Write latency
#   - Dependent service health (GitLab, Keycloak, SonarQube, ArgoCD)
#   - Active alerts
#
# Related:
#   - CloudWatch Alarms: modules/rds-monitoring/main.tf
#   - Prometheus Alerts: domains/observability/infra/alerts/rds-connectivity-alerts.yaml
#   - ADR-089: RDS Availability Monitoring
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rds-monitoring-dashboard
  namespace: staging-observability-monitoring
  labels:
    grafana_dashboard: "1"  # Auto-imported by Grafana sidecar
    app.kubernetes.io/name: grafana-dashboard
    app.kubernetes.io/component: rds-monitoring
    app.kubernetes.io/managed-by: kubectl
    team: platform-sre
