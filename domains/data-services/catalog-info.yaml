apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: data-hatch-etl
  title: "Data Hatch ETL"
  description: "Pipeline ETL Python para ingestão e transformação de dados. CronJob agendado no Kubernetes com secrets via ESO/Vault."
  annotations:
    # Integração Kubernetes — exibe pods em tempo real
    backstage.io/kubernetes-id: "hatch-etl"
    backstage.io/kubernetes-namespace: "staging-data-hatch-etl"
    backstage.io/managed-by-location: "url:https://gitlab.staging.internal/etl/hatch/-/blob/main/catalog-info.yaml"
    backstage.io/source-location: "url:https://gitlab.staging.internal/etl/hatch"
    # S6-D: Observability annotations (canonical)
    argocd/app-name: "staging-data-hatch-etl"
    argocd/app-namespace: "staging-data-hatch-etl"
    # Integração GitLab
    gitlab.com/project-slug: "etl/hatch"
    # S6-D: Integração Grafana (canonical)
    grafana/dashboard-selector: "app=hatch-etl"
    grafana/alert-label-selector: "app=hatch-etl"
  tags:
    - etl
    - python
    - data-pipeline
    - cronjob
    - data-services
  links:
    - url: "https://grafana.staging.internal/d/hatch-etl-overview"
      title: "Grafana — Hatch ETL Dashboard"
      icon: "dashboard"
      type: monitoring
    - url: "https://argocd.staging.internal/applications/staging-data-hatch-etl"
      title: "ArgoCD — staging deployment"
      icon: "argoCD"
      type: deployment
    - url: "https://vault.staging.internal/ui/vault/secrets/secret/staging/hatch"
      title: "Vault — Secrets Hatch"
      icon: "security"
      type: secrets
    - title: "GitLab Repository"
      url: "https://gitlab.staging.internal/etl/hatch"
      icon: "gitlab"
      type: website
spec:
  type: service
  lifecycle: production
  owner: data-team
  system: data-hatch-etl
  dependsOn:
    - resource:default/staging-data-hatch-etl-postgresql
    - resource:default/staging-data-hatch-etl-s3
