# =============================================================================
# Complete CI/CD Pipeline Example — Immutable Image Tags (CICD-004)
# =============================================================================
# Demonstrates the full tagging strategy with:
#   - sha-$CI_COMMIT_SHORT_SHA  (primary, always immutable)
#   - v$CI_COMMIT_TAG           (semver release, immutable)
#   - staging / dev             (environment shortcut, mutable)
#
# Copy this to your project root as .gitlab-ci.yml and adjust variables.
#
# Pipeline flow:
#   build → test → scan → deploy
#
# Tag lifecycle per branch/event:
#   feature/* branch push  → sha-abc1234 + dev tag
#   main branch push       → sha-abc1234 + staging tag
#   git tag v1.2.3         → sha-abc1234 + v1.2.3 tag (both immutable)
#   ArgoCD syncs           → always references sha-abc1234 (immutable)
#
# Prerequisites:
#   - Harbor projects created (platform-apps / microservices / infrastructure)
#   - Immutability rules applied: scripts/harbor/configure-immutability.sh
#   - Runner credentials via ESO: harbor-admin-credentials (harbor-system)
#
# ADR: docs/adr/adr-084-immutable-image-tags-enforcement.md
# =============================================================================

include:
  - project: 'platform/templates'
    file: '/gitlab-ci/templates/build-immutable.gitlab-ci.yml'

stages:
  - build
  - test
  - scan
  - deploy

# ---------------------------------------------------------------------------
# Variables
# ---------------------------------------------------------------------------
variables:
  # Harbor project for this application
  # Options: platform-apps | microservices | infrastructure
  HARBOR_PROJECT: "microservices"

  # Docker settings
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

  # ArgoCD deployment target
  ARGOCD_SERVER: "argocd.staging.internal"
  ARGOCD_OPTS: "--grpc-web --insecure"

# ---------------------------------------------------------------------------
# BUILD — Feature branches (dev tag, mutable)
# ---------------------------------------------------------------------------
build-dev:
  extends: .build-immutable
  stage: build
  variables:
    HARBOR_PROJECT: "microservices"
    CI_ENVIRONMENT_NAME: "dev"
  rules:
    # Run on all branches except main and production
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main" && $CI_COMMIT_BRANCH != "production"'
      when: on_success

# ---------------------------------------------------------------------------
# BUILD — Main branch (staging tag, mutable)
# ---------------------------------------------------------------------------
build-staging:
  extends: .build-immutable
  stage: build
  variables:
    HARBOR_PROJECT: "microservices"
    CI_ENVIRONMENT_NAME: "staging"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success

# ---------------------------------------------------------------------------
# BUILD — Git tags (release, no mutable env tag)
# ---------------------------------------------------------------------------
build-release:
  extends: .build-immutable
  stage: build
  variables:
    HARBOR_PROJECT: "microservices"
    # No CI_ENVIRONMENT_NAME: only sha-* and v* tags are pushed
  rules:
    # Only run on semver tags: v1.2.3, v1.2.3-rc1, etc.
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+.*$/'
      when: on_success

# ---------------------------------------------------------------------------
# TEST — Run against the immutable SHA image
# ---------------------------------------------------------------------------
test:
  stage: test
  image: "${HARBOR_REGISTRY}/microservices/${CI_PROJECT_PATH_SLUG}:sha-${CI_COMMIT_SHORT_SHA}"
  needs:
    - job: build-dev
      optional: true
      artifacts: true
    - job: build-staging
      optional: true
      artifacts: true
    - job: build-release
      optional: true
      artifacts: true
  script:
    - echo "Running tests against immutable image: sha-${CI_COMMIT_SHORT_SHA}"
    # Add your test commands here:
    # - pytest tests/ --junitxml=report.xml
    # - go test ./... -v
    # - npm test
  artifacts:
    when: always
    reports:
      junit: report.xml
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

# ---------------------------------------------------------------------------
# SCAN — SonarQube code quality
# ---------------------------------------------------------------------------
sonarqube-check:
  stage: scan
  image: sonarsource/sonar-scanner-cli:latest
  needs: []  # Can run in parallel with test
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
      -Dsonar.host.url="${SONAR_HOST_URL}"
      -Dsonar.token="${SONAR_TOKEN}"
      -Dsonar.projectKey="${CI_PROJECT_PATH_SLUG}"
      -Dsonar.projectName="${CI_PROJECT_NAME}"
      -Dsonar.sources=.
      -Dsonar.scm.provider=git
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG'

# ---------------------------------------------------------------------------
# DEPLOY — Staging via ArgoCD (references immutable sha-* tag)
# ---------------------------------------------------------------------------
deploy-staging:
  stage: deploy
  image: argoproj/argocd:v2.10.0
  needs:
    - job: build-staging
      artifacts: true
    - job: test
      optional: true
  # IMAGE_SHA_TAG is set by build-staging via build.env artifact
  script:
    - |
      echo "============================================================"
      echo " Deploying to STAGING"
      echo " Image: ${IMAGE_SHA_TAG}"
      echo " ArgoCD App: ${CI_PROJECT_NAME}"
      echo "============================================================"
    # Option A: ArgoCD sync (GitOps — ArgoCD watches the Git repo)
    - argocd app sync "${CI_PROJECT_NAME}"
        --auth-token "${ARGOCD_TOKEN}"
        --server "${ARGOCD_SERVER}"
        ${ARGOCD_OPTS}
    - argocd app wait "${CI_PROJECT_NAME}"
        --auth-token "${ARGOCD_TOKEN}"
        --server "${ARGOCD_SERVER}"
        ${ARGOCD_OPTS}
        --timeout 180
    # Option B: ArgoCD image override (direct image update without git commit)
    # Uncomment if your ArgoCD Application uses image-tag parameter:
    # - argocd app set "${CI_PROJECT_NAME}"
    #     --auth-token "${ARGOCD_TOKEN}"
    #     --server "${ARGOCD_SERVER}"
    #     ${ARGOCD_OPTS}
    #     -p image.tag="sha-${CI_COMMIT_SHORT_SHA}"
  environment:
    name: staging
    url: https://${CI_PROJECT_NAME}.staging.internal
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: never

# ---------------------------------------------------------------------------
# DEPLOY — Production via ArgoCD (references immutable v* tag)
# ---------------------------------------------------------------------------
deploy-production:
  stage: deploy
  image: argoproj/argocd:v2.10.0
  needs:
    - job: build-release
      artifacts: true
    - job: test
      optional: true
    - job: sonarqube-check
      optional: true
  script:
    - |
      echo "============================================================"
      echo " Deploying to PRODUCTION"
      echo " Image: ${IMAGE_SHA_TAG}"
      echo " Version: ${CI_COMMIT_TAG}"
      echo "============================================================"
    # Validate: ensure tag is semver (defense in depth — Harbor also enforces)
    - |
      if ! echo "${CI_COMMIT_TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+'; then
        echo "ERROR: ${CI_COMMIT_TAG} is not a valid semver tag (expected v1.2.3)"
        exit 1
      fi
    - argocd app sync "${CI_PROJECT_NAME}-production"
        --auth-token "${ARGOCD_TOKEN}"
        --server "${ARGOCD_SERVER}"
        ${ARGOCD_OPTS}
    - argocd app wait "${CI_PROJECT_NAME}-production"
        --auth-token "${ARGOCD_TOKEN}"
        --server "${ARGOCD_SERVER}"
        ${ARGOCD_OPTS}
        --timeout 300
  environment:
    name: production
    url: https://${CI_PROJECT_NAME}.prod.internal
  # Manual gate for production deployments
  when: manual
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+.*$/'
      when: manual
    - when: never
