# =============================================================================
# GAP-005: End-to-End CI/CD Smoke Test Pipeline
# =============================================================================
# Propósito: Validar toda a cadeia CI/CD da plataforma com um job real.
#
# Cadeia validada:
#   runner (k8s) → build (kaniko) → scan (SonarQube) → push (Harbor) → verify
#
# Runner: kubernetes executor, namespace gitlab-staging, id=115
# Registry: harbor.staging.internal (robot$gitlab-ci via ESO → gitlab-ci-credentials)
# Scanner: sonarqube.staging.internal (SONAR_TOKEN via ESO → gitlab-ci-credentials)
#
# Credentials injetadas automaticamente via runner envFrom (ESO ExternalSecret):
#   HARBOR_REGISTRY   = harbor.staging.internal
#   HARBOR_USER       = robot$gitlab-ci
#   HARBOR_PASSWORD   = <vault managed>
#   SONAR_HOST_URL    = http://sonarqube.staging.internal
#   SONAR_TOKEN       = <vault managed>
#
# Uso: Adicionar este arquivo como .gitlab-ci.yml no projeto smoke-test-ci.
#      Executar via: scripts/cicd/create-smoke-test-project.sh
#
# Demanda: GAP-005 — Pipeline End-to-End Validation
# Data: 2026-03-04
# =============================================================================

stages:
  - validate
  - build
  - scan
  - push
  - verify

variables:
  # Image destination no Harbor (projeto library para smoke tests)
  IMAGE_NAME: "harbor.staging.internal/library/smoke-test"
  IMAGE_TAG: "${CI_COMMIT_SHORT_SHA}"
  IMAGE_FULL: "${IMAGE_NAME}:${IMAGE_TAG}"

  # Kaniko settings
  KANIKO_CACHE: "false"
  KANIKO_SKIP_TLS: "true"

  # SonarQube settings
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"

default:
  tags:
    - kubernetes
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# =============================================================================
# STAGE 1: validate
# Confirma que o runner está online, registrado e recebendo jobs
# =============================================================================
validate-runner:
  stage: validate
  image: alpine:3.19
  script:
    - |
      echo "============================================================"
      echo " GAP-005: Runner Validation"
      echo "============================================================"
      echo " Runner ID:       ${CI_RUNNER_ID:-unknown}"
      echo " Runner Version:  ${CI_RUNNER_VERSION:-unknown}"
      echo " Runner Tags:     ${CI_RUNNER_TAGS:-unknown}"
      echo " Job ID:          ${CI_JOB_ID}"
      echo " Job URL:         ${CI_JOB_URL}"
      echo " Pipeline ID:     ${CI_PIPELINE_ID}"
      echo " Pipeline URL:    ${CI_PIPELINE_URL}"
      echo " Commit SHA:      ${CI_COMMIT_SHA}"
      echo " Commit Short:    ${CI_COMMIT_SHORT_SHA}"
      echo " Branch/Ref:      ${CI_COMMIT_REF_NAME}"
      echo " Project:         ${CI_PROJECT_PATH}"
      echo " Namespace:       ${CI_PROJECT_NAMESPACE}"
      echo "============================================================"
    - echo "Verificando ferramentas disponíveis no runner..."
    - which sh && echo "  sh: OK" || echo "  sh: NOT FOUND"
    - which curl && echo "  curl: OK" || apk add -q curl && echo "  curl: instalado"
    - which wget && echo "  wget: OK" || echo "  wget: não disponível"
    - echo ""
    - echo "Verificando variáveis de credentials (sem expor valores)..."
    - |
      for var in HARBOR_REGISTRY HARBOR_USER HARBOR_PASSWORD SONAR_HOST_URL SONAR_TOKEN; do
        eval "val=\${${var}:-}"
        if [ -n "${val}" ]; then
          echo "  ${var}: SET (length=$(echo -n "${val}" | wc -c))"
        else
          echo "  ${var}: NOT SET — runner envFrom pode não estar funcionando"
        fi
      done
    - echo ""
    - echo "Runner validation: PASSED"
  artifacts:
    reports:
      dotenv: runner-info.env
    expire_in: 1 day
  after_script:
    - |
      cat > runner-info.env <<EOF
      SMOKE_RUNNER_ID=${CI_RUNNER_ID:-unknown}
      SMOKE_JOB_ID=${CI_JOB_ID}
      SMOKE_PIPELINE_ID=${CI_PIPELINE_ID}
      SMOKE_COMMIT=${CI_COMMIT_SHORT_SHA}
      SMOKE_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
      EOF

# =============================================================================
# STAGE 2: build
# Constrói a imagem usando kaniko (sem Docker daemon — compatível com K8s runner)
# =============================================================================
build-image:
  stage: build
  needs:
    - job: validate-runner
  # Kaniko debug image inclui shell para debugging
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - |
      echo "============================================================"
      echo " GAP-005: Image Build (kaniko)"
      echo "============================================================"
      echo " Image: ${IMAGE_FULL}"
      echo " Context: ${CI_PROJECT_DIR}"
      echo " Dockerfile: ${CI_PROJECT_DIR}/Dockerfile"
      echo "============================================================"
    # Configurar autenticação Harbor no kaniko
    - mkdir -p /kaniko/.docker
    - |
      # Harbor auth via runner credentials (HARBOR_USER / HARBOR_PASSWORD)
      # Injetados pelo runner envFrom → gitlab-ci-credentials secret (ESO)
      if [ -n "${HARBOR_USER:-}" ] && [ -n "${HARBOR_PASSWORD:-}" ]; then
        AUTH=$(printf '%s:%s' "${HARBOR_USER}" "${HARBOR_PASSWORD}" | base64 | tr -d '\n')
        cat > /kaniko/.docker/config.json <<DOCKERCONFIG
      {
        "auths": {
          "${HARBOR_REGISTRY:-harbor.staging.internal}": {
            "auth": "${AUTH}"
          }
        }
      }
      DOCKERCONFIG
        echo "  Harbor auth configurado para: ${HARBOR_REGISTRY:-harbor.staging.internal}"
      else
        echo "[WARN] HARBOR_USER ou HARBOR_PASSWORD não definidos."
        echo "       Build continuará sem push (--no-push)."
        KANIKO_NO_PUSH="--no-push"
      fi
    # Executar build kaniko
    - |
      echo ""
      echo "Iniciando build kaniko..."
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile" \
        --destination "${IMAGE_FULL}" \
        --label "git.commit=${CI_COMMIT_SHA}" \
        --label "git.ref=${CI_COMMIT_REF_NAME}" \
        --label "build.pipeline=${CI_PIPELINE_ID}" \
        --label "gap=GAP-005" \
        --skip-tls-verify \
        --skip-tls-verify-pull \
        ${KANIKO_NO_PUSH:-} \
        2>&1 | tee /tmp/kaniko-build.log

      BUILD_EXIT=${PIPESTATUS[0]}
      if [ "${BUILD_EXIT}" -eq 0 ]; then
        echo ""
        echo "Build kaniko: PASSED"
        echo "IMAGE_BUILT=${IMAGE_FULL}" > build-result.env
        echo "BUILD_STATUS=success" >> build-result.env
      else
        echo ""
        echo "[ERROR] Build kaniko falhou (exit code=${BUILD_EXIT})"
        echo "BUILD_STATUS=failed" > build-result.env
        exit "${BUILD_EXIT}"
      fi
  artifacts:
    reports:
      dotenv: build-result.env
    paths:
      - /tmp/kaniko-build.log
    expire_in: 1 day
    when: always
  # Permitir falha se Harbor não estiver acessível (smoke test parcial)
  allow_failure: false

# =============================================================================
# STAGE 3: scan
# Executa análise SonarQube (allow_failure=true para não bloquear smoke test)
# =============================================================================
sonarqube-scan:
  stage: scan
  needs:
    - job: validate-runner
  image: sonarsource/sonar-scanner-cli:5.0
  cache:
    key: "sonar-${CI_PROJECT_PATH_SLUG}"
    paths:
      - .sonar/cache
  script:
    - |
      echo "============================================================"
      echo " GAP-005: SonarQube Scan"
      echo "============================================================"
      echo " Host: ${SONAR_HOST_URL:-NOT SET}"
      echo " Project Key: ${CI_PROJECT_PATH_SLUG}"
      echo "============================================================"
    - |
      if [ -z "${SONAR_HOST_URL:-}" ] || [ -z "${SONAR_TOKEN:-}" ]; then
        echo "[WARN] SONAR_HOST_URL ou SONAR_TOKEN não definidos."
        echo "       Scan SonarQube ignorado neste run."
        echo "       Verifique o runner envFrom e o ExternalSecret gitlab-ci-credentials."
        echo "SONAR_STATUS=skipped" > sonar-result.env
        exit 0
      fi
    - |
      sonar-scanner \
        -Dsonar.host.url="${SONAR_HOST_URL}" \
        -Dsonar.token="${SONAR_TOKEN}" \
        -Dsonar.projectKey="${CI_PROJECT_PATH_SLUG}" \
        -Dsonar.projectName="smoke-test-ci (GAP-005)" \
        -Dsonar.sources=. \
        -Dsonar.scm.provider=git \
        -Dsonar.branch.name="${CI_COMMIT_REF_NAME}" \
        2>&1 | tee /tmp/sonar-scan.log

      SONAR_EXIT=${PIPESTATUS[0]}
      if [ "${SONAR_EXIT}" -eq 0 ]; then
        echo "SONAR_STATUS=success" > sonar-result.env
        echo "SonarQube scan: PASSED"
      else
        echo "SONAR_STATUS=failed" > sonar-result.env
        echo "[WARN] SonarQube scan retornou erro (exit=${SONAR_EXIT}) — pipeline continua (allow_failure=true)"
      fi
  artifacts:
    reports:
      dotenv: sonar-result.env
    expire_in: 1 day
    when: always
  # Não bloquear o smoke test por falha de QG — o objetivo é validar o runner e build
  allow_failure: true

# =============================================================================
# STAGE 4: push (verificação pós-build)
# Confirma que a imagem foi publicada no Harbor e está acessível
# =============================================================================
verify-harbor-push:
  stage: push
  needs:
    - job: build-image
      artifacts: true
  image: alpine:3.19
  script:
    - apk add -q curl jq
    - |
      echo "============================================================"
      echo " GAP-005: Harbor Push Verification"
      echo "============================================================"
      echo " Registry: ${HARBOR_REGISTRY:-harbor.staging.internal}"
      echo " Image: ${IMAGE_FULL}"
      echo "============================================================"
    - |
      HARBOR_HOST="${HARBOR_REGISTRY:-harbor.staging.internal}"
      PROJECT="library"
      REPO="smoke-test"
      TAG="${IMAGE_TAG}"

      # Verificar via Harbor API se a tag foi publicada
      if [ -n "${HARBOR_USER:-}" ] && [ -n "${HARBOR_PASSWORD:-}" ]; then
        HARBOR_API_URL="http://${HARBOR_HOST}/api/v2.0"
        HTTP_CODE=$(curl -s -o /tmp/harbor-check.json -w "%{http_code}" \
          -u "${HARBOR_USER}:${HARBOR_PASSWORD}" \
          "${HARBOR_API_URL}/projects/${PROJECT}/repositories/${REPO}/artifacts/${TAG}" \
          --insecure 2>/dev/null || echo "000")

        if [ "${HTTP_CODE}" = "200" ]; then
          echo "Harbor push verificado via API: OK (HTTP ${HTTP_CODE})"
          DIGEST=$(cat /tmp/harbor-check.json | jq -r '.digest // "unknown"' 2>/dev/null || echo "unknown")
          echo "Digest: ${DIGEST}"
          echo "HARBOR_PUSH_STATUS=verified" > harbor-check.env
        elif [ "${HTTP_CODE}" = "404" ]; then
          echo "[WARN] Imagem não encontrada no Harbor (HTTP 404)."
          echo "       Pode indicar: projeto 'library' não existe, ou build não fez push."
          echo "HARBOR_PUSH_STATUS=not_found" > harbor-check.env
        else
          echo "[WARN] Harbor API retornou HTTP ${HTTP_CODE}."
          echo "HARBOR_PUSH_STATUS=unknown_${HTTP_CODE}" > harbor-check.env
        fi
      else
        echo "[WARN] Credentials Harbor não disponíveis — verificação pulada."
        echo "HARBOR_PUSH_STATUS=skipped_no_creds" > harbor-check.env
      fi
  artifacts:
    reports:
      dotenv: harbor-check.env
    expire_in: 1 day
    when: always
  allow_failure: true

# =============================================================================
# STAGE 5: verify
# Sumário final do smoke test com todos os resultados
# =============================================================================
verify-pipeline:
  stage: verify
  needs:
    - job: validate-runner
      artifacts: true
    - job: build-image
      artifacts: true
    - job: sonarqube-scan
      artifacts: true
      optional: true
    - job: verify-harbor-push
      artifacts: true
      optional: true
  image: alpine:3.19
  script:
    - |
      echo ""
      echo "============================================================"
      echo " GAP-005: CI/CD End-to-End Smoke Test — RESULTADO FINAL"
      echo "============================================================"
      echo ""
      echo " Timestamp:   $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
      echo " Pipeline ID: ${CI_PIPELINE_ID}"
      echo " Commit:      ${CI_COMMIT_SHORT_SHA}"
      echo " Branch:      ${CI_COMMIT_REF_NAME}"
      echo ""
      echo " Componentes validados:"
      echo " ─────────────────────────────────────────────────────────"
      echo "  [1] Runner (k8s executor)   ${SMOKE_RUNNER_ID:+OK — id=${SMOKE_RUNNER_ID}}${SMOKE_RUNNER_ID:-FALHOU}"
      echo "  [2] Build (kaniko)          ${BUILD_STATUS:-unknown}"
      echo "  [3] Scan (SonarQube)        ${SONAR_STATUS:-not_executed}"
      echo "  [4] Push (Harbor)           ${HARBOR_PUSH_STATUS:-not_checked}"
      echo " ─────────────────────────────────────────────────────────"
      echo ""
      echo " Imagem: ${IMAGE_BUILT:-${IMAGE_FULL}}"
      echo ""

      # Avaliar resultado global
      if [ "${BUILD_STATUS:-}" = "success" ]; then
        echo " SMOKE TEST: PASSED"
        echo " GAP-005: Pipeline end-to-end VALIDADO"
        echo " Status: PRONTO para uso por equipes de desenvolvimento"
      else
        echo " SMOKE TEST: PARTIAL/FAILED"
        echo " Verificar logs dos jobs anteriores para detalhes."
      fi

      echo "============================================================"
      echo ""
      echo " Proximos passos:"
      echo "   1. Configurar ARGOCD_TOKEN no projeto (Settings > CI/CD > Variables)"
      echo "   2. Criar ApplicationSet no ArgoCD para deploy automatico"
      echo "   3. Replicar template para projetos reais das equipes"
      echo "   4. Documentar como GAP-005 CONCLUIDO"
      echo "============================================================"
  allow_failure: false
