# =============================================================================
# Build Template — Immutable Image Tags (CICD-004)
# =============================================================================
# Implements the K8s Platform tagging strategy with Harbor immutability enforcement.
#
# TAGGING STRATEGY:
#
#   PRIMARY   — sha-$CI_COMMIT_SHORT_SHA        (IMMUTABLE — always created)
#               Example: sha-a1b2c3d
#               Use:     Stable reference for ArgoCD GitOps deployments
#               Policy:  Harbor immutability rule prevents overwrites
#
#   SECONDARY — v$CI_COMMIT_TAG                 (IMMUTABLE — created on git tags only)
#               Example: v1.2.3
#               Use:     Production releases and rollback targets
#               Policy:  Harbor immutability rule prevents overwrites
#
#   ENVIRONMENT — $CI_ENVIRONMENT_NAME          (MUTABLE — dev/staging only)
#               Example: dev, staging, dev-main, staging-feature-auth
#               Use:     Shortcut for current environment state
#               Policy:  Mutable in dev/staging; BLOCKED in prod by Harbor rule
#
# USAGE:
#   Include this template in your project .gitlab-ci.yml:
#
#     include:
#       - project: 'platform/templates'
#         file: '/gitlab-ci/templates/build-immutable.gitlab-ci.yml'
#
#     build:
#       extends: .build-immutable
#       variables:
#         HARBOR_PROJECT: platform-apps  # or microservices / infrastructure
#
# CREDENTIALS (injected automatically via runner envFrom):
#   HARBOR_REGISTRY   = harbor.staging.internal
#   HARBOR_USER       = robot$gitlab-ci
#   HARBOR_PASSWORD   = <vault managed via ESO harbor-admin-credentials>
#
# ADR: docs/adr/adr-084-immutable-image-tags-enforcement.md
# Guide: docs/guides/image-tagging-best-practices.md
# =============================================================================

# ---------------------------------------------------------------------------
# Hidden job — extend this in your pipeline
# ---------------------------------------------------------------------------

.build-immutable:
  stage: build
  image: docker:24
  services:
    - docker:24-dind

  # ---------------------------------------------------------------------------
  # Tagging Strategy Variables
  # ---------------------------------------------------------------------------
  variables:
    # Target Harbor project (override in your job)
    HARBOR_PROJECT: "microservices"

    # Docker build context (override if Dockerfile is not in root)
    DOCKER_CONTEXT: "."
    DOCKERFILE_PATH: "Dockerfile"

    # DinD settings
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""

    # -------------------------------------------------------------------------
    # PRIMARY TAG — sha-$CI_COMMIT_SHORT_SHA
    # Immutable, always created. This is the source of truth for GitOps.
    # ArgoCD ApplicationSets reference this tag for deployments.
    # -------------------------------------------------------------------------
    DOCKER_TAG_SHA: "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${CI_PROJECT_PATH_SLUG}:sha-${CI_COMMIT_SHORT_SHA}"

    # -------------------------------------------------------------------------
    # SECONDARY TAG — v$CI_COMMIT_TAG
    # Created only when pipeline is triggered by a git tag (e.g., v1.2.3).
    # Used for production releases. Empty when not a tag pipeline.
    # -------------------------------------------------------------------------
    DOCKER_TAG_VERSION: "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${CI_PROJECT_PATH_SLUG}:${CI_COMMIT_TAG}"

    # -------------------------------------------------------------------------
    # ENVIRONMENT TAG — $CI_ENVIRONMENT_NAME (MUTABLE)
    # Mutable shortcut for current environment state.
    # Allowed values: dev, staging, dev-*, staging-*, feature-*
    # BLOCKED by Harbor in production (immutability policy).
    # -------------------------------------------------------------------------
    DOCKER_TAG_ENV: "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${CI_PROJECT_PATH_SLUG}:${CI_ENVIRONMENT_NAME}"

  # ---------------------------------------------------------------------------
  before_script:
    - |
      echo "============================================================"
      echo " K8s Platform — Immutable Image Build (CICD-004)"
      echo "============================================================"
      echo " Project:     ${CI_PROJECT_PATH}"
      echo " Commit:      ${CI_COMMIT_SHORT_SHA} (${CI_COMMIT_REF_NAME})"
      echo " Environment: ${CI_ENVIRONMENT_NAME:-not-set}"
      echo " Registry:    ${HARBOR_REGISTRY}/${HARBOR_PROJECT}"
      echo "============================================================"
    - docker login "${HARBOR_REGISTRY}" -u "${HARBOR_USER}" -p "${HARBOR_PASSWORD}"

  # ---------------------------------------------------------------------------
  script:
    # ---- Step 1: Build image (single build, multiple tags) ------------------
    - |
      echo ""
      echo "--- Building image ---"
      echo "Context:    ${DOCKER_CONTEXT}"
      echo "Dockerfile: ${DOCKERFILE_PATH}"

      docker build \
        --file "${DOCKERFILE_PATH}" \
        --label "git.commit=${CI_COMMIT_SHA}" \
        --label "git.ref=${CI_COMMIT_REF_NAME}" \
        --label "git.project=${CI_PROJECT_PATH}" \
        --label "build.pipeline=${CI_PIPELINE_ID}" \
        --label "build.job=${CI_JOB_ID}" \
        --label "build.timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        --tag "${DOCKER_TAG_SHA}" \
        "${DOCKER_CONTEXT}"

    # ---- Step 2: Push PRIMARY tag (sha-*) — IMMUTABLE ----------------------
    - |
      echo ""
      echo "--- Pushing PRIMARY tag (IMMUTABLE) ---"
      echo "Tag: ${DOCKER_TAG_SHA}"
      docker push "${DOCKER_TAG_SHA}"
      echo "OK: Primary tag pushed successfully"

    # ---- Step 3: Push SECONDARY tag (v*) — IMMUTABLE, only on git tags -----
    - |
      if [ -n "${CI_COMMIT_TAG}" ]; then
        echo ""
        echo "--- Pushing SECONDARY tag (IMMUTABLE, semver release) ---"
        echo "Tag: ${DOCKER_TAG_VERSION}"
        docker tag "${DOCKER_TAG_SHA}" "${DOCKER_TAG_VERSION}"
        docker push "${DOCKER_TAG_VERSION}"
        echo "OK: Version tag pushed successfully"
      else
        echo ""
        echo "--- Skipping SECONDARY tag (no git tag — not a release) ---"
        echo "Tip: Create a git tag (e.g., v1.2.3) to trigger a versioned release"
      fi

    # ---- Step 4: Push ENVIRONMENT tag — MUTABLE (dev/staging only) ---------
    - |
      if [ -n "${CI_ENVIRONMENT_NAME}" ]; then
        # Validate: block 'prod' / 'production' environment tags
        # Harbor enforces this at registry level, but we add a CI-side guard
        case "${CI_ENVIRONMENT_NAME}" in
          prod|production|prd)
            echo ""
            echo "--- BLOCKED: ENVIRONMENT tag rejected for production ---"
            echo "Environment '${CI_ENVIRONMENT_NAME}' is not allowed as a mutable tag."
            echo "Production deployments MUST reference an immutable sha-* or v* tag."
            echo "See: docs/guides/image-tagging-best-practices.md"
            exit 1
            ;;
          dev*|staging*|feature*|hotfix*)
            echo ""
            echo "--- Pushing ENVIRONMENT tag (MUTABLE) ---"
            echo "Tag: ${DOCKER_TAG_ENV}"
            docker tag "${DOCKER_TAG_SHA}" "${DOCKER_TAG_ENV}"
            docker push "${DOCKER_TAG_ENV}"
            echo "OK: Environment tag pushed (mutable shortcut)"
            ;;
          *)
            echo ""
            echo "--- WARNING: Unrecognized environment '${CI_ENVIRONMENT_NAME}' ---"
            echo "Environment tag was NOT pushed. Only dev/staging/feature/* are mutable."
            echo "Use sha-* tag for deployments to this environment."
            ;;
        esac
      else
        echo ""
        echo "--- Skipping ENVIRONMENT tag (CI_ENVIRONMENT_NAME not set) ---"
      fi

    # ---- Step 5: Output image digest for GitOps traceability ---------------
    - |
      echo ""
      echo "============================================================"
      echo " Build Complete — Image References"
      echo "============================================================"
      echo " PRIMARY (GitOps):    ${DOCKER_TAG_SHA}"
      if [ -n "${CI_COMMIT_TAG}" ]; then
        echo " SECONDARY (Release): ${DOCKER_TAG_VERSION}"
      fi
      if [ -n "${CI_ENVIRONMENT_NAME}" ]; then
        echo " ENVIRONMENT (Dev):   ${DOCKER_TAG_ENV}"
      fi
      echo ""
      # Export digest for downstream jobs (deploy stage uses this)
      DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${DOCKER_TAG_SHA}" 2>/dev/null || echo "unavailable")
      echo " Digest: ${DIGEST}"
      echo "============================================================"
      # Write image reference to artifact for use in deploy stage
      echo "IMAGE_SHA_TAG=${DOCKER_TAG_SHA}" > build.env
      echo "IMAGE_DIGEST=${DIGEST}" >> build.env
      echo "GIT_COMMIT=${CI_COMMIT_SHA}" >> build.env
      echo "GIT_SHORT_SHA=${CI_COMMIT_SHORT_SHA}" >> build.env

  # ---------------------------------------------------------------------------
  after_script:
    - docker logout "${HARBOR_REGISTRY}"

  # ---------------------------------------------------------------------------
  # Artifacts — pass image reference to deploy stage
  # ---------------------------------------------------------------------------
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 1 day

  # ---------------------------------------------------------------------------
  # Caching — Docker layer cache (optional, requires GCS or S3 cache backend)
  # ---------------------------------------------------------------------------
  # cache:
  #   key: "docker-${CI_PROJECT_PATH_SLUG}-${CI_COMMIT_REF_SLUG}"
  #   paths:
  #     - .docker-cache/

# ---------------------------------------------------------------------------
# Convenience: version-only build (for release pipelines)
# Extends .build-immutable and only runs on git tags (v*)
# ---------------------------------------------------------------------------

.build-release:
  extends: .build-immutable
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+.*$/'
      when: on_success
    - when: never

# ---------------------------------------------------------------------------
# Convenience: dev build (for feature branch pipelines)
# Extends .build-immutable with dev environment tag
# ---------------------------------------------------------------------------

.build-dev:
  extends: .build-immutable
  variables:
    CI_ENVIRONMENT_NAME: "dev"
  rules:
    - if: '$CI_COMMIT_BRANCH != "main" && $CI_COMMIT_BRANCH != "production"'
      when: on_success
    - when: never

# ---------------------------------------------------------------------------
# Convenience: staging build (for main branch pipelines)
# Extends .build-immutable with staging environment tag
# ---------------------------------------------------------------------------

.build-staging:
  extends: .build-immutable
  variables:
    CI_ENVIRONMENT_NAME: "staging"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: never
