---
# V-011: Velero Backup Monitoring Dashboard ConfigMap
# Deploy this ConfigMap to automatically provision the Velero dashboard in Grafana
#
# Prerequisites:
#   - Grafana sidecar enabled with label: grafana_dashboard: "1"
#   - Velero ServiceMonitor enabled (metrics available at port 8085)
#
# Deployment:
#   kubectl apply -f kubectl-manifests/monitoring/velero-dashboard-cm.yaml
#
# Verify:
#   kubectl get cm -n monitoring velero-dashboard
#   Check Grafana UI: Dashboards → Velero Backup & Restore Monitoring
apiVersion: v1
kind: ConfigMap
metadata:
  name: velero-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: velero
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: velero
    release: kube-prometheus-stack
  annotations:
    meta.helm.sh/release-name: kube-prometheus-stack
    meta.helm.sh/release-namespace: monitoring
data:
  velero-backup-monitoring.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 95
                  },
                  {
                    "color": "green",
                    "value": 99
                  }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "orientation": "auto",
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true,
            "text": {}
          },
          "pluginVersion": "10.0.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(sum(increase(velero_backup_success_total{namespace=\"$namespace\"}[24h])) / (sum(increase(velero_backup_success_total{namespace=\"$namespace\"}[24h])) + sum(increase(velero_backup_failure_total{namespace=\"$namespace\"}[24h])))) * 100",
              "refId": "A"
            }
          ],
          "title": "Backup Success Rate (24h)",
          "type": "gauge"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 95
                  },
                  {
                    "color": "green",
                    "value": 99
                  }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "id": 2,
          "options": {
            "orientation": "auto",
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true,
            "text": {}
          },
          "pluginVersion": "10.0.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(sum(increase(velero_backup_success_total{namespace=\"$namespace\"}[7d])) / (sum(increase(velero_backup_success_total{namespace=\"$namespace\"}[7d])) + sum(increase(velero_backup_failure_total{namespace=\"$namespace\"}[7d])))) * 100",
              "refId": "A"
            }
          ],
          "title": "Backup Success Rate (7d)",
          "type": "gauge"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
