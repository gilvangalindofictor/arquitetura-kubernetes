---
# VPA for Vault StatefulSet (P0 - Secret Management)
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vault
  namespace: vault-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: vault
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: vault
        minAllowed:
          cpu: 250m
          memory: 256Mi
        maxAllowed:
          cpu: 2000m
          memory: 2Gi
        controlledResources: ["cpu", "memory"]
---
# VPA for Keycloak StatefulSet (P0 - SSO/Authentication)
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: keycloak
  namespace: keycloak
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: keycloak-keycloakx
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: keycloak
        minAllowed:
          cpu: 500m
          memory: 1Gi
        maxAllowed:
          cpu: 4000m
          memory: 6Gi
        controlledResources: ["cpu", "memory"]
---
# VPA for GitLab Webservice (P0 - CI/CD Platform)
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: gitlab-webservice
  namespace: gitlab-staging
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gitlab-webservice-default
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: webservice
        minAllowed:
          cpu: 250m
          memory: 1Gi
        maxAllowed:
          cpu: 4000m
          memory: 6Gi
        controlledResources: ["cpu", "memory"]
      - containerName: gitlab-workhorse
        minAllowed:
          cpu: 100m
          memory: 128Mi
        maxAllowed:
          cpu: 1000m
          memory: 1Gi
        controlledResources: ["cpu", "memory"]
---
# VPA for Prometheus StatefulSet (P0 - Observability)
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: prometheus
  namespace: staging-observability-monitoring
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: prometheus-kube-prometheus-stack-prometheus
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: prometheus
        minAllowed:
          cpu: 100m
          memory: 512Mi
        maxAllowed:
          cpu: 2000m
          memory: 4Gi
        controlledResources: ["cpu", "memory"]
      - containerName: config-reloader
        minAllowed:
          cpu: 50m
          memory: 64Mi
        maxAllowed:
          cpu: 500m
          memory: 512Mi
        controlledResources: ["cpu", "memory"]
