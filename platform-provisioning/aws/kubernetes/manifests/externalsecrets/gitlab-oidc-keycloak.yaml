apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gitlab-oidc-keycloak
  namespace: staging-platform-gitlab
  labels:
    app.kubernetes.io/managed-by: external-secrets
    environment: staging
    tier: auth
  annotations:
    # ADR-101: Secrets Migration to Vault + ExternalSecrets
    # Migrated: 2026-03-05 from plain K8s Secret
    # Vault path: secret/data/gitlab/oidc-keycloak
    # Key: provider (full OIDC provider YAML config for GitLab omniauth)
    # Contains: client_id, client_secret, issuer URL, endpoints
    # PREREQUISITE: Configure GitLab Helm values global.appConfig.omniauth.providers existingSecret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gitlab-oidc-keycloak
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: provider
      remoteRef:
        key: secret/data/gitlab/oidc-keycloak
        property: provider
