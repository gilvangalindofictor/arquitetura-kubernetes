apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harbor-exporter
  namespace: staging-platform-harbor
  labels:
    app.kubernetes.io/managed-by: external-secrets
    app.kubernetes.io/name: harbor-exporter
    environment: staging
    tier: database
  annotations:
    # IaC drift fix: secret harbor-exporter em staging-platform-harbor tinha senha
    # hardcoded errada. Corrigido manualmente para HarborPGa1ebc3ec41e9806a95af598cSvc.
    # Esta ExternalSecret garante que o valor venha do Vault KV e elimina o hardcode.
    # Vault path: secret/data/harbor/postgresql (mesma fonte usada pelo harbor-core ESO)
    # Fix registrado: 2026-03-09
    # Related: V-003 (harbor postgresql migration to Vault + ESO, 2026-02-24)
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-exporter
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Harbor exporter reads DB password via HARBOR_DATABASE_PASSWORD env var
    # Secret key must match what the harbor chart sets in the exporter deployment
    - secretKey: HARBOR_DATABASE_PASSWORD
      remoteRef:
        key: secret/data/harbor/postgresql
        property: password
    # Additional keys for completeness (exporter may also use these)
    - secretKey: password
      remoteRef:
        key: secret/data/harbor/postgresql
        property: password
