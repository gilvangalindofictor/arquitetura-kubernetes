apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gitlab-minio-secret
  namespace: staging-platform-gitlab
  labels:
    app.kubernetes.io/managed-by: external-secrets
    environment: staging
    tier: storage
  annotations:
    # ADR-101: Secrets Migration to Vault + ExternalSecrets
    # Migrated: 2026-03-05 from plain K8s Secret
    # Vault path: secret/data/gitlab/minio-secret
    # Keys: accesskey, secretkey (MinIO S3-compatible object storage credentials)
    # PREREQUISITE: Configure GitLab Helm values global.minio.existingSecret before activating
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gitlab-minio-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: accesskey
      remoteRef:
        key: secret/data/gitlab/minio-secret
        property: accesskey
    - secretKey: secretkey
      remoteRef:
        key: secret/data/gitlab/minio-secret
        property: secretkey
