apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gitlab-postgresql-password
  namespace: staging-platform-gitlab
  labels:
    app.kubernetes.io/managed-by: external-secrets
    environment: staging
    tier: database
  annotations:
    # ADR-101: Secrets Migration to Vault + ExternalSecrets
    # Migrated: 2026-03-05 from plain K8s Secret
    # Vault path: secret/data/gitlab/postgresql-password
    # PREREQUISITE: Configure GitLab Helm values to use existingSecret before applying
    # See: docs/demands/2026-03-05-secrets-migration-vault.md — GitLab migration procedure
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gitlab-postgresql-password
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: secret/data/gitlab/postgresql-password
        property: password
