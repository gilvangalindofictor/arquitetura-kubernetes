---
# ADR-101: P2 GitLab Helm-generated internal service secrets
# These secrets are generated by GitLab Helm chart on first deploy.
# Migration procedure: stop GitLab → apply ExternalSecrets → helm upgrade with existingSecret → restart
# Vault paths: secret/data/gitlab/{rails-secret,gitaly-secret,gitlab-kas-secret,gitlab-shell-secret,gitlab-workhorse-secret}
# Sprint target: next sprint after P1 completion validation
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gitlab-rails-secret
  namespace: staging-platform-gitlab
  labels:
    app.kubernetes.io/managed-by: external-secrets
    environment: staging
    tier: application
    migration-priority: P2
  annotations:
    # Vault path: secret/data/gitlab/rails-secret
    # Key: secrets.yml — Rails secret_key_base, db_key_base, otp_key_base
    # PREREQUISITE: GitLab Helm chart must reference existingSecret before activating
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gitlab-rails-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: secrets.yml
      remoteRef:
        key: secret/data/gitlab/rails-secret
        property: secrets.yml
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gitlab-gitaly-secret
  namespace: staging-platform-gitlab
  labels:
    app.kubernetes.io/managed-by: external-secrets
    environment: staging
    tier: application
    migration-priority: P2
  annotations:
    # Vault path: secret/data/gitlab/gitaly-secret
    # Key: token — Gitaly authentication token
    # PREREQUISITE: GitLab Helm chart gitaly.authToken.secret existingSecret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gitlab-gitaly-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: secret/data/gitlab/gitaly-secret
        property: secret
