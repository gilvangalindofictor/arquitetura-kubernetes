apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redis-password
  namespace: data-services
  labels:
    app.kubernetes.io/managed-by: external-secrets
    environment: staging
    tier: cache
  annotations:
    # ADR-101: Secrets Migration to Vault + ExternalSecrets
    # Migrated: 2026-03-05 from plain K8s Secret
    # Vault path: secret/data/redis/password
    # NOTE: Same Redis instance is shared with staging-platform-gitlab
    # See: redis-password-gitlab.yaml for the GitLab namespace copy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: redis-password
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: secret/data/redis/password
        property: password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redis-password
  namespace: staging-platform-gitlab
  labels:
    app.kubernetes.io/managed-by: external-secrets
    environment: staging
    tier: cache
  annotations:
    # ADR-101: Same Redis password mirrored to GitLab namespace
    # Vault path: secret/data/redis/password
    # PREREQUISITE: Configure GitLab Helm values with global.redis.auth.existingSecret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: redis-password
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: secret/data/redis/password
        property: password
