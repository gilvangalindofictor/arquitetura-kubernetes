apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gitlab-root-password
  namespace: staging-platform-gitlab
  labels:
    app.kubernetes.io/managed-by: external-secrets
    environment: staging
    tier: application
  annotations:
    # ADR-101: Secrets Migration to Vault + ExternalSecrets
    # Migrated: 2026-03-05 from plain K8s Secret
    # Vault path: secret/data/gitlab/root-password
    # NOTE: GitLab reads initial root password from gitlab-gitlab-initial-root-password secret
    # This ExternalSecret replaces gitlab-root-password (used by GitLab rails config)
    # PREREQUISITE: Configure GitLab Helm values with existingSecret before activating
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gitlab-root-password
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: secret/data/gitlab/root-password
        property: password
