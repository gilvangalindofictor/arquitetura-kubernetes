apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harbor-registry-secret
  namespace: staging-platform-backstage
  labels:
    app.kubernetes.io/managed-by: external-secrets
    app.kubernetes.io/name: harbor-registry-secret
    environment: staging
    tier: registry
  annotations:
    # Motivação: harbor-registry-secret em staging-platform-backstage era plain K8s Secret
    # sem owner. Credencial robot$gitlab-ci expirou em 2026-03-17 causando ImagePullBackOff.
    # Token atualizado manualmente e armazenado em secret/harbor/robot-account.
    # Este ExternalSecret transfere ownership para ESO — rotações futuras no Vault propagam
    # automaticamente para o cluster sem intervenção manual.
    # Vault path: secret/data/harbor/robot-account
    # Keys: name (robot username), secret (robot token)
    # Ref: docs/demands/2026-03-17-eso-harbor-registry-secret.md
    # Criado: 2026-03-17
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-registry-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"harbor.staging.internal":{"username":"{{ .robotName }}","password":"{{ .robotSecret }}","auth":"{{ printf "%s:%s" .robotName .robotSecret | b64enc }}"}}}'
  data:
    - secretKey: robotName
      remoteRef:
        key: secret/data/harbor/robot-account
        property: name
    - secretKey: robotSecret
      remoteRef:
        key: secret/data/harbor/robot-account
        property: secret
