# GitLab CE - Staging Restore
# Minimal values to restore GitLab with existing secrets

# Edition
global:
  edition: ce

  # Hosts
  hosts:
    domain: staging.internal
    https: false
    # GitLab 18.x: OpenBao host required even when disabled (template references it)
    openbao:
      name: openbao.staging.internal
      https: false

  # External PostgreSQL
  psql:
    host: k8s-platform-prod-postgresql.cw9kqksocqv1.us-east-1.rds.amazonaws.com
    port: 5432
    database: gitlab
    username: gitlab_user
    password:
      useSecret: true
      secret: gitlab-postgresql-password
      key: password

  # External Redis
  redis:
    host: redis.data-services.svc.cluster.local
    port: 6379
    auth:
      enabled: true
      secret: gitlab-redis-password
      key: password

  # Ingress
  ingress:
    enabled: true
    class: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/backend-protocol: HTTP
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
      alb.ingress.kubernetes.io/group.name: gitlab-staging

  # App config
  appConfig:
    # LFS
    lfs:
      enabled: true
      bucket: k8s-platform-staging-gitlab-artifacts
      connection:
        secret: gitlab-object-storage
        key: connection

    # Artifacts
    artifacts:
      enabled: true
      bucket: k8s-platform-staging-gitlab-artifacts
      connection:
        secret: gitlab-object-storage
        key: connection

    # Uploads
    uploads:
      enabled: true
      bucket: k8s-platform-staging-gitlab-artifacts
      connection:
        secret: gitlab-object-storage
        key: connection

    # OmniAuth (OIDC with Keycloak)
    omniAuth:
      enabled: true
      allowSingleSignOn: ['openid_connect']
      blockAutoCreatedUsers: false
      autoLinkUser: ['openid_connect']
      syncProfileFromProvider: ['openid_connect']
      providers:
        - secret: gitlab-oidc-keycloak
          key: provider

    # Required for GitLab 8.10.x+ (chart 8.10.x disables cell by default)
    cell:
      enabled: false

    # Required for GitLab 8.11.x+ (chart 8.11.x)
    oidcProvider:
      openidIdTokenExpireInSeconds: 120

    # GitLab 18.x: CI/CD ID token issuer URL must be explicitly set
    ciIdTokens:
      issuerUrl: "https://gitlab.staging.internal"

    # GitLab 18.4+: relativeUrlRoot must be empty string (not nil)
    # Without this, Go template produces %!s(<nil>) in external_url, causing
    # KAS URI validation to fail: "gitlab.external_url: value must be a valid URI"
    relativeUrlRoot: ""

  # Versão atual deployada — atualizar a cada upgrade step
  # INFRA-001: 9.9.1 (v18.9.1) DEPLOYED Rev 36 (2026-03-03)
  gitlabVersion: "18.9.1"

  # GitLab 18.x compatibility overrides (discovered 2026-03-03 INFRA-001)
  # OpenBao replaced HashiCorp Vault in 18.x — must be explicitly disabled if not used
  openbao:
    enabled: false
  # Workspaces feature introduced in 18.x — disable to avoid subchart errors
  workspaces:
    enabled: false
  # Gateway API introduced in 18.8.x — disable to avoid nil pointer in httproute.yaml template
  # Also requires gatewayRef.name/namespace (9.9+) even when disabled — chart template bug
  gatewayApi:
    enabled: false
    installEnvoy: false
    gatewayRef:
      name: ""
      namespace: ""
    class:
      name: "gitlab-gw"

# GitLab 18.x: explicit cert-manager disable (separate from certmanager.install)
installCertmanager: false

# Resources (staging optimized)
gitlab:
  webservice:
    minReplicas: 1
    maxReplicas: 1
    resources:
      requests:
        cpu: 300m
        memory: 1536Mi
      limits:
        cpu: 2000m
        memory: 4Gi

  sidekiq:
    minReplicas: 1
    maxReplicas: 1
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 2Gi

  gitaly:
    persistence:
      enabled: true
      storageClass: gp3
      size: 50Gi
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        cpu: 500m
        memory: 1Gi

# Disable GitLab components
postgresql:
  install: false
  # GitLab 18.x: declare PG16 image tag to match RDS version (INFRA-002 completed)
  image:
    tag: "16.4"

redis:
  install: false

nginx-ingress:
  enabled: false

certmanager:
  install: false

certmanager-issuer:
  email: platform-team@example.com

prometheus:
  install: false

# GitLab 18.x: OpenBao subchart (replaced HashiCorp Vault) — disable to prevent template errors
openbao:
  install: false

registry:
  enabled: false
  # GitLab 18.x: registry metadata database (off — using Harbor instead)
  database:
    enabled: false

gitlab-runner:
  install: true
  replicas: 1
  # GitLab 17.x+ auth token (glrt-): set runnerRegistrationToken="" to signal
  # isAuthToken=true. This prevents REGISTER_LOCKED/RUNNER_TAG_LIST env vars
  # that cause FATAL error with auth token registration flow.
  # The actual token lives in runner-token key of gitlab-gitlab-runner-secret.
  runnerRegistrationToken: ""
  # Override computed URL (http://host:80) since nginx-ingress is disabled.
  # Runner must reach GitLab via workhorse port 8181 directly.
  gitlabUrl: "http://gitlab.staging.internal:8181"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  runners:
    # GitLab 17.x+ auth token workflow: locked/tags managed server-side
    # Do NOT set runners.locked or runners.tags here — causes FATAL registration error
    config: |
      [[runners]]
        [runners.kubernetes]
          image = "ubuntu:22.04"
        [runners.cache]
          Type = "s3"
          Path = "gitlab-runner"
          Shared = true
          [runners.cache.s3]
            ServerAddress = "minio.staging.internal"
            BucketName = "runner-cache"
            BucketLocation = "us-east-1"
            Insecure = false
