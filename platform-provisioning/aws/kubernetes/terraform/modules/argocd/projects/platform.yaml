---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  # ADR-105 (2026-03-12): Migrado de namespace: argocd para staging-platform-argocd
  namespace: staging-platform-argocd
  labels:
    app.kubernetes.io/managed-by: terraform
spec:
  description: Platform infrastructure components (Keycloak, SonarQube, Vault, etc.)

  # Source repositories (where platform code lives)
  # ADR-105 GAP-SEC-02: sourceRepos restrito — wildcard '*' removido.
  # Repositorios internos (GitLab staging) + Helm externos necessarios para
  # Vault, Keycloak, Harbor, SonarQube, Kyverno, Grafana/Loki/Tempo, monitoring.
  sourceRepos:
    - 'https://gitlab.staging.internal/*'
    - 'https://helm.releases.hashicorp.com'          # Vault
    - 'https://codecentric.github.io/helm-charts'    # Keycloak
    - 'https://helm.goharbor.io'                     # Harbor
    - 'https://kyverno.github.io/kyverno'            # Kyverno
    - 'https://grafana.github.io/helm-charts'        # Grafana, Loki, Tempo
    - 'https://argoproj.github.io/argo-helm'         # ArgoCD
    - 'https://charts.helm.sh/stable'                # Helm stable

  # Destinations (where apps can be deployed)
  destinations:
    - namespace: 'keycloak'
      server: https://kubernetes.default.svc
    - namespace: 'sonarqube'
      server: https://kubernetes.default.svc
    - namespace: 'vault-system'
      server: https://kubernetes.default.svc
    - namespace: 'gitlab'
      server: https://kubernetes.default.svc
    - namespace: 'harbor'
      server: https://kubernetes.default.svc
    - namespace: 'monitoring'
      server: https://kubernetes.default.svc
    - namespace: 'cert-manager'
      server: https://kubernetes.default.svc
    - namespace: 'external-secrets'
      server: https://kubernetes.default.svc
    - namespace: 'kube-system'
      server: https://kubernetes.default.svc

  # Cluster resources allowed
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: ''
      kind: PersistentVolume
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRole
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRoleBinding
    - group: 'apiextensions.k8s.io'
      kind: CustomResourceDefinition
    - group: 'admissionregistration.k8s.io'
      kind: MutatingWebhookConfiguration
    - group: 'admissionregistration.k8s.io'
      kind: ValidatingWebhookConfiguration
    - group: 'storage.k8s.io'
      kind: StorageClass

  # Namespace resources allowed (explicit list)
  # ADR-105 GAP-PROJ-01 (2026-03-12): Wildcard */* substituído por lista explicita.
  # Motivo: blast radius — wildcard permite gerenciar QUALQUER recurso namespace-scoped.
  # Lista cobre: Vault, Keycloak, Harbor, SonarQube, ArgoCD, Kyverno, Grafana/Loki/Tempo,
  # cert-manager, external-secrets, monitoring. Para adicionar novo kind, abrir MR.
  namespaceResourceWhitelist:
    # Core Kubernetes
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: Secret
    - group: ''
      kind: Service
    - group: ''
      kind: ServiceAccount
    - group: ''
      kind: Pod
    - group: ''
      kind: Endpoints
    - group: ''
      kind: PersistentVolumeClaim
    - group: ''
      kind: ResourceQuota
    - group: ''
      kind: LimitRange
    - group: ''
      kind: Event
    # Apps
    - group: 'apps'
      kind: Deployment
    - group: 'apps'
      kind: StatefulSet
    - group: 'apps'
      kind: DaemonSet
    - group: 'apps'
      kind: ReplicaSet
    # Networking
    - group: 'networking.k8s.io'
      kind: Ingress
    - group: 'networking.k8s.io'
      kind: NetworkPolicy
    # RBAC namespace-scoped
    - group: 'rbac.authorization.k8s.io'
      kind: Role
    - group: 'rbac.authorization.k8s.io'
      kind: RoleBinding
    # Autoscaling
    - group: 'autoscaling'
      kind: HorizontalPodAutoscaler
    # Batch
    - group: 'batch'
      kind: Job
    - group: 'batch'
      kind: CronJob
    # Policy
    - group: 'policy'
      kind: PodDisruptionBudget
    # External Secrets
    - group: 'external-secrets.io'
      kind: ExternalSecret
    - group: 'external-secrets.io'
      kind: SecretStore
    # Monitoring
    - group: 'monitoring.coreos.com'
      kind: ServiceMonitor
    - group: 'monitoring.coreos.com'
      kind: PrometheusRule
    - group: 'monitoring.coreos.com'
      kind: PodMonitor
    # Cert Manager
    - group: 'cert-manager.io'
      kind: Certificate
    - group: 'cert-manager.io'
      kind: Issuer

  # RBAC policies
  roles:
    # Platform admins (full access)
    - name: admin
      description: Full access to platform project
      policies:
        - p, proj:platform:admin, applications, *, platform/*, allow
      groups:
        - argocd-admins
        - platform-admins

    # Platform developers (read-only)
    - name: developer
      description: Read-only access to platform project
      policies:
        - p, proj:platform:developer, applications, get, platform/*, allow
        - p, proj:platform:developer, applications, sync, platform/*, allow
      groups:
        - developers

  # Sync windows (maintenance windows)
  syncWindows:
    - kind: allow
      schedule: '0 0 * * *'  # Daily at midnight
      duration: 1h
      applications:
        - '*'
      manualSync: true
