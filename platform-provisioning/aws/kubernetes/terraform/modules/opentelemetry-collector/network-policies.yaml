- # Network Policy: Allow apps to send OTLP to OTel Collector
  apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    name: allow-apps-to-otel-collector
    namespace: ${namespace}
  spec:
    podSelector:
      matchLabels:
        app.kubernetes.io/name: opentelemetry-collector
    policyTypes:
      - Ingress
    ingress:
      # Allow OTLP gRPC (4317) from all pods
      - from:
          - namespaceSelector: {}
        ports:
          - protocol: TCP
            port: 4317
      # Allow OTLP HTTP (4318) from all pods
      - from:
          - namespaceSelector: {}
        ports:
          - protocol: TCP
            port: 4318
      # Allow metrics scraping from Prometheus
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: ${observability_namespace}
            podSelector:
              matchLabels:
                app.kubernetes.io/name: prometheus
        ports:
          - protocol: TCP
            port: 8888
- # Network Policy: Allow OTel Collector to export to backends
  apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    name: allow-otel-to-backends
    namespace: ${namespace}
  spec:
    podSelector:
      matchLabels:
        app.kubernetes.io/name: opentelemetry-collector
    policyTypes:
      - Egress
    egress:
      # Allow egress to Tempo (traces)
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: ${observability_namespace}
            podSelector:
              matchLabels:
                app.kubernetes.io/name: tempo
        ports:
          - protocol: TCP
            port: 4317
      # Allow egress to Prometheus (metrics)
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: ${observability_namespace}
            podSelector:
              matchLabels:
                app: kube-prometheus-stack-prometheus
        ports:
          - protocol: TCP
            port: 9090
      # Allow egress to Loki (logs)
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: ${observability_namespace}
            podSelector:
              matchLabels:
                app.kubernetes.io/name: loki
        ports:
          - protocol: TCP
            port: 3100
      # Allow DNS resolution
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            podSelector:
              matchLabels:
                k8s-app: kube-dns
        ports:
          - protocol: UDP
            port: 53
