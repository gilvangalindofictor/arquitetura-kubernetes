# Velero Helm Chart Values
# Chart: vmware-tanzu/velero
# Version: 8.1.0 (Velero v1.15.1)

# IRSA configuration (no static credentials needed)
credentials:
  useSecret: false

# Service account with IRSA annotation
serviceAccount:
  server:
    create: true
    name: velero-server
    annotations:
      # This will be templated with actual IAM role ARN from Terraform
      eks.amazonaws.com/role-arn: "${VELERO_ROLE_ARN}"

# Velero server configuration
configuration:
  # Backup storage location (S3)
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: "${VELERO_BUCKET_NAME}"
      config:
        region: us-east-1
        # Server-side encryption
        serverSideEncryption: AES256
      # Backup sync interval
      accessMode: ReadWrite
      default: true

  # Volume snapshot location (EBS snapshots)
  volumeSnapshotLocation:
    - name: default
      provider: aws
      config:
        region: us-east-1

  # Default backup retention (30 days)
  backupRetentionPeriod: 720h

  # Log level
  logLevel: info

  # Features
  features: EnableCSI

# Init containers for AWS plugin
initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.11.0
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins

# Resource requests/limits
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Node selector for system node pool
nodeSelector:
  workload: system

# Tolerations for system nodes
tolerations:
  - key: workload
    operator: Equal
    value: system
    effect: NoSchedule

# Metrics configuration
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack

# Cleanup CRDs on uninstall
cleanUpCRDs: false

# Backup schedules (managed separately via CRDs)
schedules: {}

# Deploy restic for file-level backup (optional)
deployNodeAgent: true
nodeAgent:
  podVolumePath: /var/lib/kubelet/pods
  privileged: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  tolerations:
    - operator: Exists

# Upgrade CRDs automatically
upgradeCRDs: true

# kubectl binary for backup hooks
kubectl:
  image:
    repository: docker.io/bitnami/kubectl
    tag: 1.34.0
