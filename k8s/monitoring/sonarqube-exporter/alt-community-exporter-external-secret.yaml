apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sonarqube-exporter-credentials
  namespace: sonarqube
  labels:
    app: sonarqube-exporter
    component: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: sonarqube-exporter-credentials
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: secret/sonarqube/prometheus-exporter
        property: token
    - secretKey: sonarqube-url
      remoteRef:
        key: secret/sonarqube/prometheus-exporter
        property: url
