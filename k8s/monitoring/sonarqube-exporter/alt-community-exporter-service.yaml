apiVersion: v1
kind: Service
metadata:
  name: sonarqube-exporter
  namespace: sonarqube
  labels:
    app: sonarqube-exporter
    component: monitoring
    app.kubernetes.io/name: sonarqube-exporter
    app.kubernetes.io/component: monitoring
spec:
  selector:
    app: sonarqube-exporter
  ports:
  - name: metrics
    port: 9000
    targetPort: metrics
    protocol: TCP
  type: ClusterIP
